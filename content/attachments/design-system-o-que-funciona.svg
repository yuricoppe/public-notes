<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Gráfico de barras comparando quantos design systems em geral têm cada prática com quantos entre os considerados bem-sucedidos a têm, segundo a pesquisa da Sparkbox de 2022: onboarding 30 por cento contra 84, processo de contribuição 61 contra 76, treino e suporte 37 contra 76, e métricas apenas 16 por cento no geral">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .all   { fill: #9ca3af; }
    .win   { fill: #2563eb; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .k   { font-size: 11.5px; font-weight: 700; }
    .n   { font-size: 12.5px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .all { fill: #6b7280; }
      .win { fill: #60a5fa; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O que separa os que funcionam</text>
  <text x="0" y="44" class="muted cap">Pesquisa da Sparkbox, 2022, 219 respostas. Barra cinza: todos. Barra azul: os declarados bem-sucedidos.</text>

  <rect x="0" y="66" width="14" height="12" class="all"/>
  <text x="22" y="77" class="muted k">TODOS</text>
  <rect x="94" y="66" width="14" height="12" class="win"/>
  <text x="116" y="77" class="accent k">BEM-SUCEDIDOS</text>

  <text x="0" y="112" class="ink h">Onboarding de quem vai usar</text>
  <rect x="250" y="100" width="120" height="16" class="all"/>
  <text x="378" y="113" class="muted n">30%</text>
  <rect x="250" y="120" width="336" height="16" class="win"/>
  <text x="594" y="133" class="accent n">84%</text>

  <text x="0" y="172" class="ink h">Treino e suporte</text>
  <rect x="250" y="160" width="148" height="16" class="all"/>
  <text x="406" y="173" class="muted n">37%</text>
  <rect x="250" y="180" width="304" height="16" class="win"/>
  <text x="562" y="193" class="accent n">76%</text>

  <text x="0" y="232" class="ink h">Processo de contribuição</text>
  <rect x="250" y="220" width="244" height="16" class="all"/>
  <text x="502" y="233" class="muted n">61%</text>
  <rect x="250" y="240" width="304" height="16" class="win"/>
  <text x="562" y="253" class="accent n">76%</text>

  <text x="0" y="292" class="ink h">Critério do que entra</text>
  <rect x="250" y="280" width="176" height="16" class="all"/>
  <text x="434" y="293" class="muted n">44%</text>
  <rect x="250" y="300" width="312" height="16" class="win"/>
  <text x="570" y="313" class="accent n">78%</text>

  <rect x="0" y="330" width="720" height="34" rx="6" class="box"/>
  <text x="16" y="352" class="muted cap">E a prática mais rara de todas: só <tspan class="accent n">16%</tspan> medem uso ou satisfação — mesmo número de 2021.</text>

  <text x="0" y="392" class="muted cap">Note o que não aparece na lista: mais componentes. A diferença está no que se faz em volta do acervo.</text>
</svg>
