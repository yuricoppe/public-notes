<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Comparação entre a estrutura acadêmica, que guarda a conclusão para o fim, e a pirâmide invertida, que começa pela conclusão e vai descendo em detalhe, com a observação de que a mesma regra vale para o documento, a seção, o parágrafo e a frase">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .bad   { fill: #dc2626; }
    .ok    { fill: #10b981; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .bad { fill: #f87171; } .ok { fill: #34d399; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">A conclusão vem primeiro</text>
  <text x="0" y="44" class="muted cap">Como quase ninguém chega ao fim, guardar a resposta para o fim é escondê-la</text>

  <rect x="0" y="66" width="348" height="204" rx="8" class="box"/>
  <text x="18" y="92" class="bad k">✕ COMO SE APRENDE NA ESCOLA</text>
  <polygon points="18,110 330,110 174,236" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="120" y="132" class="muted cap">contexto</text>
  <text x="132" y="164" class="muted cap">método</text>
  <text x="140" y="196" class="muted cap">dados</text>
  <text x="130" y="226" class="bad cap">resposta</text>

  <rect x="372" y="66" width="348" height="204" rx="8" class="box"/>
  <text x="390" y="92" class="ok k">✓ PIRÂMIDE INVERTIDA</text>
  <polygon points="390,236 702,236 546,110" fill="none" stroke="#10b981" stroke-width="1.6"/>
  <text x="502" y="140" class="ok cap">resposta</text>
  <text x="510" y="172" class="muted cap">o essencial</text>
  <text x="498" y="204" class="muted cap">detalhe e exceções</text>
  <text x="472" y="230" class="muted cap">contexto, procedência, notas</text>

  <rect x="0" y="290" width="720" height="34" rx="6" class="box"/>
  <text x="16" y="312" class="muted cap">A regra vale em quatro escalas ao mesmo tempo: <tspan class="ink h">documento · seção · parágrafo · frase</tspan></text>

  <text x="0" y="352" class="muted cap">Vem do jornalismo, mas a evidência é anterior à web: a estrutura melhora velocidade de leitura e retenção.</text>
</svg>
