<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="As quatro curvas de aceleração — linear, ease-in, ease-out e ease-in-out — plotadas como progresso ao longo do tempo, com a indicação de quando usar cada uma, e a escala de durações rápida, média e lenta">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .axis  { stroke: #9ca3af; stroke-width: 1; }
    .ref   { fill: none; stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 3 3; }
    .curve { fill: none; stroke: #2563eb; stroke-width: 2.5; }
    .curveM{ fill: none; stroke: #9ca3af; stroke-width: 2.5; }
    .pill  { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .accent{ fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .axis { stroke: #6b7280; }
      .ref { stroke: #4b5563; }
      .curve { stroke: #60a5fa; }
      .curveM { stroke: #6b7280; }
      .pill { fill: #1f2937; stroke: #4b5563; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">As curvas de aceleração, e por que quase nunca é linear</text>
  <text x="0" y="44" class="muted cap">Nada no mundo físico parte e para na mesma velocidade. A curva é o que faz o movimento parecer real</text>

  <!-- linear -->
  <rect x="0" y="62" width="174" height="222" rx="6" class="card"/>
  <text x="14" y="86" class="ink h">linear</text>
  <line x1="16" y1="100" x2="16" y2="200" class="axis"/>
  <line x1="16" y1="200" x2="156" y2="200" class="axis"/>
  <path d="M 16 200 C 16 200 156 100 156 100" class="curveM"/>
  <text x="14" y="226" class="muted an">Velocidade constante do</text>
  <text x="14" y="242" class="muted an">começo ao fim. Parece</text>
  <text x="14" y="258" class="muted an">mecânico — só serve para</text>
  <text x="14" y="274" class="muted an">rotação contínua.</text>

  <!-- ease-in -->
  <rect x="182" y="62" width="174" height="222" rx="6" class="card"/>
  <text x="196" y="86" class="ink h">ease-in</text>
  <line x1="198" y1="100" x2="198" y2="200" class="axis"/>
  <line x1="198" y1="200" x2="338" y2="200" class="axis"/>
  <path d="M 198 200 L 338 100" class="ref"/>
  <path d="M 198 200 C 256.8 200 338 100 338 100" class="curve"/>
  <text x="196" y="226" class="muted an">Sai devagar e acelera.</text>
  <text x="196" y="242" class="muted an">Bom para o que está indo</text>
  <text x="196" y="258" class="muted an">embora: o elemento ganha</text>
  <text x="196" y="274" class="muted an">velocidade e some.</text>

  <!-- ease-out -->
  <rect x="364" y="62" width="174" height="222" rx="6" class="card"/>
  <text x="378" y="86" class="ink h">ease-out</text>
  <line x1="380" y1="100" x2="380" y2="200" class="axis"/>
  <line x1="380" y1="200" x2="520" y2="200" class="axis"/>
  <path d="M 380 200 L 520 100" class="ref"/>
  <path d="M 380 200 C 380 200 461.2 100 520 100" class="curve"/>
  <text x="378" y="226" class="accent an">A mais útil na interface.</text>
  <text x="378" y="242" class="muted an">Arranca rápido e freia. A</text>
  <text x="378" y="258" class="muted an">resposta parece imediata</text>
  <text x="378" y="274" class="muted an">e o pouso, suave.</text>

  <!-- ease-in-out -->
  <rect x="546" y="62" width="174" height="222" rx="6" class="card"/>
  <text x="560" y="86" class="ink h">ease-in-out</text>
  <line x1="562" y1="100" x2="562" y2="200" class="axis"/>
  <line x1="562" y1="200" x2="702" y2="200" class="axis"/>
  <path d="M 562 200 L 702 100" class="ref"/>
  <path d="M 562 200 C 620.8 200 643.2 100 702 100" class="curve"/>
  <text x="560" y="226" class="muted an">Devagar nas duas pontas.</text>
  <text x="560" y="242" class="muted an">Para o que sai de um</text>
  <text x="560" y="258" class="muted an">estado e chega em outro,</text>
  <text x="560" y="274" class="muted an">como abrir um painel.</text>

  <!-- durations -->
  <text x="0" y="316" class="ink h">Duração: quanto mais o elemento se desloca, mais tempo pode levar</text>

  <rect x="0" y="330" width="232" height="52" rx="6" class="pill"/>
  <text x="14" y="352" class="ink an">Rápido · 100–200ms</text>
  <text x="14" y="370" class="muted an">Hover, foco, mudança de cor.</text>

  <rect x="244" y="330" width="232" height="52" rx="6" class="pill"/>
  <text x="258" y="352" class="ink an">Médio · 200–400ms</text>
  <text x="258" y="370" class="muted an">Modal, drawer, acordeão.</text>

  <rect x="488" y="330" width="232" height="52" rx="6" class="pill"/>
  <text x="502" y="352" class="ink an">Lento · 400–600ms</text>
  <text x="502" y="370" class="muted an">Transição de tela inteira. Raro.</text>

  <text x="0" y="410" class="muted cap">Anime só transform e opacity: o resto força o navegador a recalcular layout e derruba os 60fps.</text>
</svg>
