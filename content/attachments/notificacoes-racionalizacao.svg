<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-label="As quatro perguntas do inventário de racionalização de notificações: existe uma resposta definida, quem é a pessoa certa, qual a consequência de ignorar e por qual canal deve chegar. Notificações que não passam na primeira pergunta são rebaixadas a indicador ou eliminadas">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.3; }
    .accent{ fill: #2563eb; }
    .bad   { fill: #dc2626; }
    .line  { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .n   { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .accent { fill: #60a5fa; }
      .bad { fill: #f87171; }
      .line { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O inventário: quatro perguntas por notificação</text>
  <text x="0" y="42" class="muted cap">O exercício que a engenharia de alarmes chama de racionalização. Vale para cada gatilho já existente,</text>
  <text x="0" y="60" class="muted cap">um por um, antes de discutir o desenho de qualquer um deles.</text>

  <rect x="0" y="72" width="530" height="62" rx="8" class="box"/>
  <text x="18" y="98" class="accent n">1</text>
  <text x="44" y="98" class="ink h">Existe uma resposta definida?</text>
  <text x="44" y="120" class="muted cap">Não “é bom saber” — o que exatamente a pessoa deve fazer ao receber isto?</text>
  <path d="M530 103 H562" class="line" marker-end="url(#b)"/>
  <text x="570" y="98" class="bad cap">Se não:</text>
  <text x="570" y="118" class="muted cap">vira indicador</text>

  <rect x="0" y="146" width="530" height="62" rx="8" class="box"/>
  <text x="18" y="172" class="accent n">2</text>
  <text x="44" y="172" class="ink h">Quem é a pessoa certa?</text>
  <text x="44" y="194" class="muted cap">Quem tem autoridade e contexto para agir. Mandar para todos é mandar para ninguém.</text>
  <path d="M530 177 H562" class="line" marker-end="url(#b)"/>
  <text x="570" y="172" class="bad cap">Se são todos:</text>
  <text x="570" y="192" class="muted cap">é painel, não aviso</text>

  <rect x="0" y="220" width="530" height="62" rx="8" class="box"/>
  <text x="18" y="246" class="accent n">3</text>
  <text x="44" y="246" class="ink h">O que acontece se ninguém responder?</text>
  <text x="44" y="268" class="muted cap">A consequência define a prioridade. Nada mais define.</text>
  <path d="M530 251 H562" class="line" marker-end="url(#b)"/>
  <text x="570" y="246" class="bad cap">Se nada:</text>
  <text x="570" y="266" class="muted cap">prioridade baixa</text>

  <rect x="0" y="294" width="530" height="62" rx="8" class="box"/>
  <text x="18" y="320" class="accent n">4</text>
  <text x="44" y="320" class="ink h">Em quanto tempo precisa chegar?</text>
  <text x="44" y="342" class="muted cap">O prazo escolhe o canal. Só o que não pode esperar até a próxima sessão vira push.</text>
  <path d="M530 325 H562" class="line" marker-end="url(#b)"/>
  <text x="570" y="320" class="bad cap">Se pode esperar:</text>
  <text x="570" y="340" class="muted cap">entra no resumo</text>

  <text x="0" y="384" class="muted cap">Na prática, a maioria dos gatilhos de um produto maduro cai na primeira pergunta — e a primeira</text>
  <text x="0" y="402" class="muted cap">rodada do inventário costuma cortar mais do que ajustar.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
