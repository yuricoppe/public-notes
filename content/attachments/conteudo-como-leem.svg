<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Três números sobre leitura na tela: 79 por cento das pessoas varrem a página em vez de ler, no máximo 28 por cento do texto de uma página média é lido, e só páginas com até 111 palavras chegam a ser lidas pela metade">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .fill  { fill: #2563eb; }
    .rest  { fill: #d1d5db; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .big { font-size: 34px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .rest { fill: #4b5563; }
      .fill { fill: #60a5fa; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O que a pesquisa diz sobre ler na tela</text>
  <text x="0" y="44" class="muted cap">Três medições diferentes, feitas com onze anos de distância, que apontam para a mesma conclusão</text>

  <rect x="0" y="66" width="232" height="196" rx="8" class="box"/>
  <text x="18" y="112" class="accent big">79%</text>
  <text x="18" y="140" class="ink h">varrem a página</text>
  <text x="18" y="166" class="muted cap">Só 16% leem palavra por</text>
  <text x="18" y="184" class="muted cap">palavra. Varrer não é</text>
  <text x="18" y="202" class="muted cap">preguiça — é o modo</text>
  <text x="18" y="220" class="muted cap">normal de usar a web.</text>
  <text x="18" y="248" class="muted k">NIELSEN, 1997</text>

  <rect x="244" y="66" width="232" height="196" rx="8" class="box"/>
  <text x="262" y="112" class="accent big">28%</text>
  <text x="262" y="140" class="ink h">é o teto do que se lê</text>
  <text x="262" y="166" class="muted cap">Numa página média de</text>
  <text x="262" y="184" class="muted cap">593 palavras. O mais</text>
  <text x="262" y="202" class="muted cap">provável é 20%. Medido</text>
  <text x="262" y="220" class="muted cap">em 45.237 visitas reais.</text>
  <text x="262" y="248" class="muted k">WEINREICH ET AL., 2008</text>

  <rect x="488" y="66" width="232" height="196" rx="8" class="box"/>
  <text x="506" y="112" class="accent big">111</text>
  <text x="506" y="140" class="ink h">palavras</text>
  <text x="506" y="166" class="muted cap">É o tamanho máximo de</text>
  <text x="506" y="184" class="muted cap">uma página para que</text>
  <text x="506" y="202" class="muted cap">metade dela chegue a</text>
  <text x="506" y="220" class="muted cap">ser lida.</text>
  <text x="506" y="248" class="muted k">NIELSEN, 2008</text>

  <text x="0" y="298" class="ink h">Cada 100 palavras a mais custam 4,4 segundos — e rendem cerca de 18% de leitura a mais</text>
  <rect x="0" y="312" width="720" height="22" rx="4" class="rest"/>
  <rect x="0" y="312" width="202" height="22" rx="4" class="fill"/>
  <text x="8" y="328" class="ink k" fill="#ffffff">LIDO</text>
  <text x="214" y="328" class="muted k">NÃO LIDO</text>

  <text x="0" y="368" class="muted cap">O erro que esses números desfazem não é escrever mal — é escrever muito. Cortar metade de uma página</text>
  <text x="0" y="386" class="muted cap">não faz a pessoa perder metade da informação: faz a informação que sobra ter chance de ser vista.</text>
</svg>
