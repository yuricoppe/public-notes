<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Matriz que separa o status da mensagem — informativo, sucesso, aviso e erro — do tipo de componente que a entrega — inline, toast, banner, modal — mostrando que as duas decisões são independentes">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .cell  { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .info { fill: #2563eb; } .ok { fill: #10b981; } .warn { fill: #f59e0b; } .err { fill: #dc2626; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 12px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .cell { stroke: #4b5563; }
      .info { fill: #60a5fa; } .ok { fill: #34d399; } .warn { fill: #fbbf24; } .err { fill: #f87171; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Status e tipo são duas decisões separadas</text>
  <text x="0" y="42" class="muted cap">O status diz o que aconteceu. O tipo diz quanto isso pode atrapalhar. Confundir os dois é o que</text>
  <text x="0" y="60" class="muted cap">produz erro crítico dentro de um toast que some sozinho.</text>

  <text x="0" y="88" class="muted k">STATUS — o que aconteceu</text>
  <circle cx="10" cy="112" r="6" class="info"/>
  <text x="26" y="117" class="ink cap">Informativo — contexto que não veio de uma ação da pessoa</text>
  <circle cx="10" cy="138" r="6" class="ok"/>
  <text x="26" y="143" class="ink cap">Sucesso — a tarefa terminou como esperado</text>
  <circle cx="10" cy="164" r="6" class="warn"/>
  <text x="26" y="169" class="ink cap">Aviso — o caminho escolhido tem consequência indesejada</text>
  <circle cx="10" cy="190" r="6" class="err"/>
  <text x="26" y="195" class="ink cap">Erro — falhou, e pode ser preciso bloquear até resolver</text>

  <text x="0" y="240" class="muted k">TIPO — quanto pode atrapalhar</text>

  <rect x="0"   y="256" width="172" height="96" rx="6" class="box"/>
  <text x="16" y="280" class="ink h">Inline</text>
  <text x="16" y="304" class="muted cap">Persiste até resolver</text>
  <text x="16" y="322" class="muted cap">ou ser dispensada.</text>
  <text x="16" y="342" class="muted cap">Fica onde importa.</text>

  <rect x="184" y="256" width="172" height="96" rx="6" class="box"/>
  <text x="200" y="280" class="ink h">Toast</text>
  <text x="200" y="304" class="muted cap">Some sozinha — a não</text>
  <text x="200" y="322" class="muted cap">ser que tenha ação,</text>
  <text x="200" y="342" class="muted cap">e aí precisa persistir.</text>

  <rect x="368" y="256" width="172" height="96" rx="6" class="box"/>
  <text x="384" y="280" class="ink h">Banner</text>
  <text x="384" y="304" class="muted cap">Nível de sistema, não</text>
  <text x="384" y="322" class="muted cap">de tarefa. Persiste até</text>
  <text x="384" y="342" class="muted cap">ser dispensado.</text>

  <rect x="552" y="256" width="168" height="96" rx="6" class="box"/>
  <text x="568" y="280" class="ink h">Modal</text>
  <text x="568" y="304" class="muted cap">Bloqueia a tarefa.</text>
  <text x="568" y="322" class="muted cap">Só quando é crítico</text>
  <text x="568" y="342" class="muted cap">que a pessoa veja.</text>

  <text x="0" y="384" class="muted cap">Baseado no padrão de notificação do Carbon (IBM), que trata status e tipo como eixos combináveis.</text>
</svg>
