<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Botão voltar ao topo: ausente na primeira tela e visível depois de uma tela de rolagem, fixo no canto inferior direito">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Voltar ao topo</text>
  <text x="0" y="44" class="muted cap">Um botão que só existe quando é necessário — e que não deveria aparecer em página que não dá rolagem</text>

  <text x="0" y="72" class="ink h">Na primeira tela</text>
  <rect x="0" y="84" width="300" height="180" rx="6" class="frame"/>
  <rect x="16" y="100" width="140" height="10" rx="5" fill="#d1d5db"/>
  <rect x="16" y="122" width="268" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="16" y="136" width="248" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="16" y="150" width="268" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="16" y="164" width="200" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="16" y="186" width="268" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="16" y="200" width="230" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="16" y="214" width="268" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="16" y="228" width="180" height="6" rx="3" fill="#e5e7eb"/>
  <text x="16" y="252" class="muted sm">nada flutuando sobre o conteúdo</text>

  <path d="M 316 174 L 400 174" class="arrow"/>
  <path d="M 394 169 L 401 174 L 394 179" class="arrow"/>
  <text x="322" y="166" class="muted sm">rolagem</text>

  <text x="420" y="72" class="ink h">Passada uma tela inteira</text>
  <rect x="420" y="84" width="300" height="180" rx="6" class="frame"/>
  <rect x="436" y="100" width="268" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="436" y="114" width="248" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="436" y="128" width="268" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="436" y="142" width="210" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="436" y="164" width="268" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="436" y="178" width="248" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="436" y="192" width="190" height="6" rx="3" fill="#e5e7eb"/>
  <circle cx="686" cy="228" r="20" fill="#2563eb"/>
  <path d="M 686 236 L 686 220 M 679 227 L 686 219 L 693 227" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <text x="0" y="296" class="ink h">Aparece só depois de rolar</text>
  <text x="0" y="316" class="muted an">Antes disso ele apenas ocupa o canto</text>
  <text x="0" y="332" class="muted an">e cobre conteúdo sem ter serventia.</text>

  <text x="244" y="296" class="ink h">Rolagem suave, não salto</text>
  <text x="244" y="316" class="muted an">O salto instantâneo desorienta. Mas</text>
  <text x="244" y="332" class="muted an">respeite prefers-reduced-motion.</text>

  <text x="488" y="296" class="ink h">Rótulo explícito</text>
  <text x="488" y="316" class="muted an">aria-label="Voltar ao topo da página".</text>
  <text x="488" y="332" class="muted an">Uma seta sozinha não diz para onde vai.</text></svg>
