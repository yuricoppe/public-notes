<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" role="img" aria-label="Três itens sobre leitura: rótulo direto no gráfico em vez de legenda separada, ordem por valor em vez de alfabética, mostrada pelo caminho que o olho percorre, e barra horizontal em vez de rótulo girado na vertical">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .plot  { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .axis  { stroke: #9ca3af; stroke-width: 1; }
    .b1 { fill: #2563eb; } .b2 { fill: #60a5fa; } .b3 { fill: #93c5fd; } .b4 { fill: #cbd5e1; }
    .eyebad { stroke: #dc2626; stroke-width: 1.6; fill: none; }
    .eyeok  { stroke: #10b981; stroke-width: 1.6; fill: none; }
    .lead  { stroke: #9ca3af; stroke-width: 1; }
    .bad   { fill: #dc2626; }
    .ok    { fill: #10b981; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .why { font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    .tiny{ font-size: 9px; }
    .badge { font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .plot { fill: #111827; stroke: #374151; }
      .axis { stroke: #6b7280; } .lead { stroke: #6b7280; }
      .b1 { fill: #60a5fa; } .b2 { fill: #3b82f6; } .b3 { fill: #1d4ed8; } .b4 { fill: #475569; }
      .eyebad { stroke: #f87171; } .eyeok { stroke: #34d399; }
      .bad { fill: #f87171; } .ok { fill: #34d399; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O trio de melhor retorno por esforço</text>
  <text x="0" y="44" class="muted cap">Rotular, ordenar e virar a barra. Os três são de graça e mudam a leitura mais que qualquer paleta.</text>

  <rect x="0" y="62" width="352" height="176" rx="8" class="card"/>
  <text x="16" y="86" class="ink h">Legenda separada</text>
  <text x="16" y="104" class="muted why">Consultar a legenda custa ir e voltar para ligar cor a</text>
  <text x="16" y="119" class="muted why">nome — e some para quem não distingue as cores.</text>
  <rect x="16" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="22" y="145" class="bad badge">✕</text>
  <g transform="translate(66,186)">
    <path d="M0 0 L0 -26 A26 26 0 0 1 24 9 Z" class="b1"/>
    <path d="M0 0 L24 9 A26 26 0 0 1 -6 25 Z" class="b2"/>
    <path d="M0 0 L-6 25 A26 26 0 0 1 -24 -9 Z" class="b3"/>
    <path d="M0 0 L-24 -9 A26 26 0 0 1 0 -26 Z" class="b4"/>
  </g>
  <rect x="104" y="150" width="8" height="8" class="b1"/><text x="116" y="158" class="muted tiny">Maçã 43%</text>
  <rect x="104" y="164" width="8" height="8" class="b2"/><text x="116" y="172" class="muted tiny">Melancia 18%</text>
  <rect x="104" y="178" width="8" height="8" class="b3"/><text x="116" y="186" class="muted tiny">Morango 13%</text>
  <rect x="104" y="192" width="8" height="8" class="b4"/><text x="116" y="200" class="muted tiny">Outros 26%</text>
  <rect x="184" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="190" y="145" class="ok badge">✓</text>
  <g transform="translate(232,182)">
    <path d="M0 0 L0 -22 A22 22 0 0 1 21 8 Z" class="b1"/>
    <path d="M0 0 L21 8 A22 22 0 0 1 -5 21 Z" class="b2"/>
    <path d="M0 0 L-5 21 A22 22 0 0 1 -21 -8 Z" class="b3"/>
    <path d="M0 0 L-21 -8 A22 22 0 0 1 0 -22 Z" class="b4"/>
  </g>
  <line x1="248" y1="172" x2="272" y2="166" class="lead"/><text x="276" y="170" class="ink tiny">Maçã 43%</text>
  <line x1="240" y1="200" x2="272" y2="196" class="lead"/><text x="276" y="200" class="ink tiny">Melancia 18%</text>
  <line x1="216" y1="196" x2="272" y2="212" class="lead"/><text x="276" y="216" class="ink tiny">Morango 13%</text>

  <rect x="368" y="62" width="352" height="176" rx="8" class="card"/>
  <text x="384" y="86" class="ink h">Ordem alfabética por inércia</text>
  <text x="384" y="104" class="muted why">A seta é o caminho do olho. Sem ordem por valor, ele</text>
  <text x="384" y="119" class="muted why">vai e volta para descobrir quem é o maior.</text>
  <rect x="384" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="390" y="145" class="bad badge">✕</text>
  <path d="M400 152 L410 162 L398 172 L412 182 L400 192 L414 202 L402 212" class="eyebad"/>
  <path d="M402 212 l -5 -6 l 9 -1 z" fill="#dc2626"/>
  <rect x="424" y="150" width="38" height="8" class="b2"/>
  <rect x="424" y="162" width="62" height="8" class="b2"/>
  <rect x="424" y="174" width="30" height="8" class="b2"/>
  <rect x="424" y="186" width="96" height="8" class="b1"/>
  <rect x="424" y="198" width="44" height="8" class="b2"/>
  <rect x="424" y="210" width="26" height="8" class="b2"/>
  <rect x="552" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="558" y="145" class="ok badge">✓</text>
  <path d="M568 152 L568 210" class="eyeok"/>
  <path d="M568 212 l -4 -6 l 8 0 z" fill="#10b981"/>
  <rect x="584" y="150" width="96" height="8" class="b1"/>
  <rect x="584" y="162" width="62" height="8" class="b2"/>
  <rect x="584" y="174" width="44" height="8" class="b2"/>
  <rect x="584" y="186" width="38" height="8" class="b2"/>
  <rect x="584" y="198" width="30" height="8" class="b2"/>
  <rect x="584" y="210" width="26" height="8" class="b2"/>

  <rect x="0" y="250" width="720" height="102" rx="8" class="card"/>
  <text x="16" y="274" class="ink h">Rótulo girado na vertical</text>
  <text x="16" y="292" class="muted why">Nome comprido em coluna obriga a girar o texto — mais lento de ler e desaconselhado pelo WCAG. A barra</text>
  <text x="16" y="307" class="muted why">horizontal resolve sem truque: o nome cabe deitado, do jeito que se lê.</text>
  <rect x="16" y="316" width="152" height="26" rx="4" class="plot"/>
  <text x="22" y="333" class="bad badge">✕</text>
  <rect x="46" y="320" width="9" height="12" class="b2"/><rect x="59" y="324" width="9" height="8" class="b2"/>
  <rect x="72" y="322" width="9" height="10" class="b2"/><rect x="85" y="326" width="9" height="6" class="b2"/>
  <g transform="translate(102,340) rotate(-55)"><text x="0" y="0" class="muted tiny">Zaporizhzhya</text></g>
  <rect x="184" y="316" width="152" height="26" rx="4" class="plot"/>
  <text x="190" y="333" class="ok badge">✓</text>
  <text x="208" y="326" class="muted tiny">Zaporizhzhya</text>
  <rect x="268" y="320" width="42" height="5" class="b2"/>
  <text x="208" y="338" class="muted tiny">Kharkiv</text>
  <rect x="268" y="332" width="58" height="5" class="b1"/>

  <text x="0" y="380" class="muted cap">Uma exceção à ordem por valor: quando a pessoa vem procurar um item que ela já sabe qual é, a ordem</text>
  <text x="0" y="394" class="muted cap">alfabética ganha. Ordenar por valor serve para descobrir; ordenar por nome serve para localizar.</text>
</svg>
