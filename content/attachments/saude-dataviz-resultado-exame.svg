<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" width="720" height="446" role="img" aria-label="Comparação entre três formas de apresentar um resultado de exame ao paciente: só o número com a faixa de referência, uma barra horizontal com faixa colorida, e a barra com âncora de dano e mensagem de conclusão, com a ressalva de que estudo com rastreamento ocular não encontrou ganho de interpretação de risco só com formato">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .card  { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .warnb { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
    .warn  { fill: #b45309; }
    .accent{ fill: #2563eb; }
    .ok    { fill: #10b981; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .card { fill: #111827; stroke: #6b7280; }
      .warnb { fill: #2a2312; stroke: #fbbf24; }
      .warn { fill: #fbbf24; }
      .accent { fill: #60a5fa; } .ok { fill: #34d399; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O mesmo resultado, três apresentações</text>
  <text x="0" y="44" class="muted cap">Creatinina 1,4 mg/dL. Faixa de referência 0,6 a 1,2.</text>

  <rect x="0" y="66" width="234" height="150" rx="8" class="card"/>
  <text x="16" y="90" class="muted k">1 · SÓ O NÚMERO</text>
  <text x="16" y="124" class="ink mono">Creatinina</text>
  <text x="16" y="150" class="ink" font-size="22" font-weight="700">1,4</text>
  <text x="58" y="150" class="muted mono">mg/dL</text>
  <text x="16" y="176" class="muted cap">Ref.: 0,6 – 1,2</text>
  <text x="16" y="202" class="muted cap">O que a maioria dos portais faz.</text>

  <rect x="243" y="66" width="234" height="150" rx="8" class="card"/>
  <text x="259" y="90" class="muted k">2 · BARRA COM FAIXA</text>
  <text x="259" y="118" class="ink mono">Creatinina · 1,4 mg/dL</text>
  <rect x="259" y="132" width="90"  height="14" rx="3" fill="#f59e0b" opacity="0.35"/>
  <rect x="351" y="132" width="70"  height="14" rx="3" fill="#10b981" opacity="0.45"/>
  <rect x="423" y="132" width="38"  height="14" rx="3" fill="#f59e0b" opacity="0.35"/>
  <rect x="437" y="126" width="4" height="26" rx="2" fill="#1f2937"/>
  <text x="259" y="166" class="muted cap">baixo</text>
  <text x="358" y="166" class="ok cap">normal</text>
  <text x="428" y="166" class="warn cap">alto</text>
  <text x="259" y="196" class="muted cap">Melhora a percepção de “dentro</text>
  <text x="259" y="212" class="muted cap">ou fora”, sem dizer o que fazer.</text>

  <rect x="486" y="66" width="234" height="150" rx="8" class="card"/>
  <text x="502" y="90" class="accent k">3 · COM ÂNCORA E CONCLUSÃO</text>
  <text x="502" y="118" class="ink mono">Creatinina · 1,4 mg/dL</text>
  <rect x="502" y="132" width="90" height="14" rx="3" fill="#f59e0b" opacity="0.35"/>
  <rect x="594" y="132" width="70" height="14" rx="3" fill="#10b981" opacity="0.45"/>
  <rect x="666" y="132" width="38" height="14" rx="3" fill="#f59e0b" opacity="0.35"/>
  <rect x="680" y="126" width="4" height="26" rx="2" fill="#1f2937"/>
  <line x1="698" y1="124" x2="698" y2="154" stroke="#dc2626" stroke-width="2"/>
  <text x="502" y="170" class="muted cap">âncora: acima de 2,0 procure</text>
  <text x="502" y="186" class="muted cap">atendimento</text>
  <text x="502" y="208" class="ink h">Pouco acima do normal.</text>

  <rect x="0" y="234" width="720" height="70" rx="8" class="box"/>
  <text x="18" y="258" class="accent k">O QUE A REVISÃO SISTEMÁTICA ENCONTROU</text>
  <text x="18" y="280" class="muted cap">Em 18 estudos, a barra horizontal com blocos coloridos teve a melhor compreensão e satisfação. Com âncora</text>
  <text x="18" y="296" class="muted cap">de dano, reduziu substancialmente contato desnecessário com o médico. Número sozinho não basta.</text>

  <rect x="0" y="316" width="720" height="70" rx="8" class="warnb"/>
  <text x="18" y="340" class="warn k">E A RESSALVA QUE VEM JUNTO</text>
  <text x="18" y="362" class="muted cap">Estudo com rastreamento ocular, com 20 pacientes transplantados renais, não achou diferença de acerto entre</text>
  <text x="18" y="378" class="muted cap">três interfaces: 55%, 52% e 45%. Pacientes subestimavam a necessidade de agir mesmo com destaque visual.</text>

  <text x="0" y="416" class="muted cap">A leitura conjunta: formato resolve “estou dentro ou fora”. Não resolve “isso é urgente para mim” — que</text>
  <text x="0" y="434" class="muted cap">depende de a pessoa saber quais exames importam para a condição dela.</text>
</svg>
