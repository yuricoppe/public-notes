<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Diagrama mostrando que a voz é constante e o tom varia conforme o estado emocional de quem lê: a mesma voz produz mensagens diferentes em um momento de comemoração, de espera, de erro comum e de perda de dado">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .voice { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.6; }
    .accent{ fill: #2563eb; }
    .t1 { fill: #10b981; } .t2 { fill: #eab308; } .t3 { fill: #f59e0b; } .t4 { fill: #dc2626; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .voice { fill: #1e293b; stroke: #60a5fa; }
      .accent { fill: #60a5fa; }
      .t1 { fill: #34d399; } .t2 { fill: #facc15; } .t3 { fill: #fbbf24; } .t4 { fill: #f87171; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">A voz é uma; o tom é muitos</text>
  <text x="0" y="44" class="muted cap">Você tem sempre a mesma voz. O que muda é o tom, conforme o estado de quem está lendo.</text>

  <rect x="0" y="66" width="720" height="58" rx="8" class="voice"/>
  <text x="18" y="92" class="accent k">VOZ — NÃO MUDA</text>
  <text x="18" y="112" class="muted cap">Direta · sem rodeio · explica em vez de impressionar · humor seco, quando cabe</text>

  <rect x="0" y="144" width="174" height="150" rx="8" class="box"/>
  <rect x="0" y="144" width="174" height="5" class="t1"/>
  <text x="16" y="172" class="ink h">Deu certo</text>
  <text x="16" y="196" class="muted cap">A pessoa está aliviada</text>
  <text x="16" y="214" class="muted cap">ou satisfeita.</text>
  <text x="16" y="244" class="muted k">TOM</text>
  <text x="16" y="264" class="muted cap">Breve. Confirma e sai</text>
  <text x="16" y="282" class="muted cap">da frente.</text>

  <rect x="182" y="144" width="174" height="150" rx="8" class="box"/>
  <rect x="182" y="144" width="174" height="5" class="t2"/>
  <text x="198" y="172" class="ink h">Esperando</text>
  <text x="198" y="196" class="muted cap">A pessoa não sabe se</text>
  <text x="198" y="214" class="muted cap">travou.</text>
  <text x="198" y="244" class="muted k">TOM</text>
  <text x="198" y="264" class="muted cap">Calmo e concreto. Diga</text>
  <text x="198" y="282" class="muted cap">o que está acontecendo.</text>

  <rect x="364" y="144" width="174" height="150" rx="8" class="box"/>
  <rect x="364" y="144" width="174" height="5" class="t3"/>
  <text x="380" y="172" class="ink h">Erro comum</text>
  <text x="380" y="196" class="muted cap">Faltou um campo, o</text>
  <text x="380" y="214" class="muted cap">formato está errado.</text>
  <text x="380" y="244" class="muted k">TOM</text>
  <text x="380" y="264" class="muted cap">Neutro. Sem culpa e</text>
  <text x="380" y="282" class="muted cap">sem drama.</text>

  <rect x="546" y="144" width="174" height="150" rx="8" class="box"/>
  <rect x="546" y="144" width="174" height="5" class="t4"/>
  <text x="562" y="172" class="ink h">Perdeu algo</text>
  <text x="562" y="196" class="muted cap">Dado perdido, cobrança</text>
  <text x="562" y="214" class="muted cap">errada, prazo estourado.</text>
  <text x="562" y="244" class="muted k">TOM</text>
  <text x="562" y="264" class="muted cap">Sóbrio. Zero humor.</text>
  <text x="562" y="282" class="muted cap">Diga o que dá para fazer.</text>

  <text x="0" y="336" class="muted cap">A regra que resolve os casos difíceis: é sempre mais importante ser claro do que ser divertido. Piada em</text>
  <text x="0" y="354" class="muted cap">mensagem de erro envelhece na segunda vez que a pessoa a vê — e ela vai vê-la muitas vezes.</text>
</svg>
