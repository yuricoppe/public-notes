<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Limites de contraste da WCAG: 3 para 1 em texto grande e bordas de controle, 4,5 para 1 no nível AA para texto normal e 7 para 1 no nível AAA; com quatro amostras de cinza e azul sobre branco e o resultado de cada uma">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .sheet { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
    .rule  { stroke: #e5e7eb; stroke-width: 1; }
    .accent{ fill: #2563eb; }
    .pass  { fill: #16a34a; }
    .fail  { fill: #dc2626; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .num { font-size: 21px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 12px; }
    .cap { font-size: 13px; }
    .mark{ font-size: 13px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .rule { stroke: #374151; }
      .accent { fill: #60a5fa; }
      .pass { fill: #34d399; }
      .fail { fill: #f87171; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Os três limites de contraste, e o que passa em cada um</text>
  <text x="0" y="44" class="muted cap">A razão compara a luminosidade do texto com a do fundo. Vai de 1:1 (invisível) a 21:1 (preto no branco)</text>

  <rect x="0" y="62" width="232" height="76" rx="6" class="card"/>
  <text x="14" y="92" class="ink num">3:1</text>
  <text x="14" y="112" class="ink h">Texto grande e controles</text>
  <text x="14" y="130" class="muted an">24px+, e a borda de campos e ícones.</text>

  <rect x="244" y="62" width="232" height="76" rx="6" class="card"/>
  <text x="258" y="92" class="ink num">4,5:1</text>
  <text x="258" y="112" class="ink h">AA — texto normal</text>
  <text x="258" y="130" class="muted an">O piso legal na maior parte do mundo.</text>

  <rect x="488" y="62" width="232" height="76" rx="6" class="card"/>
  <text x="502" y="92" class="ink num">7:1</text>
  <text x="502" y="112" class="ink h">AAA — texto normal</text>
  <text x="502" y="130" class="muted an">Onde vale mirar quando dá.</text>

  <!-- table header -->
  <text x="0"   y="170" class="muted an">Amostra sobre fundo branco</text>
  <text x="330" y="170" class="muted an">Razão</text>
  <text x="424" y="170" class="muted an">AA</text>
  <text x="502" y="170" class="muted an">AA grande</text>
  <text x="630" y="170" class="muted an">AAA</text>
  <line x1="0" y1="178" x2="720" y2="178" class="rule"/>

  <!-- row 1 -->
  <rect x="0" y="186" width="310" height="30" rx="4" class="sheet"/>
  <text x="12" y="206" font-size="14" fill="#111827">Cinza 900 — corpo de texto</text>
  <text x="330" y="206" class="ink an">18,2:1</text>
  <text x="424" y="206" class="pass mark">✓</text>
  <text x="502" y="206" class="pass mark">✓</text>
  <text x="630" y="206" class="pass mark">✓</text>

  <!-- row 2 -->
  <rect x="0" y="224" width="310" height="30" rx="4" class="sheet"/>
  <text x="12" y="244" font-size="14" fill="#2563eb">Azul 600 — link e ação</text>
  <text x="330" y="244" class="ink an">5,2:1</text>
  <text x="424" y="244" class="pass mark">✓</text>
  <text x="502" y="244" class="pass mark">✓</text>
  <text x="630" y="244" class="fail mark">✕</text>

  <!-- row 3 -->
  <rect x="0" y="262" width="310" height="30" rx="4" class="sheet"/>
  <text x="12" y="282" font-size="14" fill="#6b7280">Cinza 500 — texto secundário</text>
  <text x="330" y="282" class="ink an">4,8:1</text>
  <text x="424" y="282" class="pass mark">✓</text>
  <text x="502" y="282" class="pass mark">✓</text>
  <text x="630" y="282" class="fail mark">✕</text>

  <!-- row 4 -->
  <rect x="0" y="300" width="310" height="30" rx="4" class="sheet"/>
  <text x="12" y="320" font-size="14" fill="#9ca3af">Cinza 400 — o placeholder típico</text>
  <text x="330" y="320" class="ink an">2,6:1</text>
  <text x="424" y="320" class="fail mark">✕</text>
  <text x="502" y="320" class="fail mark">✕</text>
  <text x="630" y="320" class="fail mark">✕</text>

  <line x1="0" y1="348" x2="720" y2="348" class="rule"/>
  <text x="0" y="372" class="muted cap">A quarta linha é o cinza que todo mundo usa em placeholder e texto de apoio — e que reprova em tudo.</text>
  <text x="0" y="392" class="accent cap">Um degrau na escala de neutras costuma resolver: 400 → 500 já cruza o piso de 4,5:1.</text>
</svg>
