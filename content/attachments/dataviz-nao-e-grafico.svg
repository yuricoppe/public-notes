<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Três casos em que gráfico é a resposta errada: um número só vira um cartão em vez de uma barra sozinha, duas fatias viram uma frase em vez de uma pizza, e muitos valores precisos viram tabela em vez de gráfico">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .card  { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .bar   { fill: #2563eb; }
    .grid  { stroke: #d1d5db; stroke-width: 1; }
    .bad   { fill: #dc2626; }
    .ok    { fill: #10b981; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .big { font-size: 30px; font-weight: 700; }
    .cap { font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .card { fill: #111827; stroke: #6b7280; }
      .bar { fill: #60a5fa; }
      .grid { stroke: #4b5563; }
      .bad { fill: #f87171; } .ok { fill: #34d399; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Quando o gráfico é a resposta errada</text>
  <text x="0" y="44" class="muted cap">Gráfico serve para mostrar relação entre números. Sem relação para mostrar, ele só custa espaço e atenção.</text>

  <rect x="0" y="66" width="234" height="250" rx="8" class="box"/>
  <text x="16" y="90" class="bad k">✕ UMA BARRA SÓ</text>
  <line x1="40" y1="176" x2="120" y2="176" class="grid"/>
  <rect x="62" y="112" width="36" height="64" rx="3" class="bar"/>
  <text x="16" y="200" class="muted cap">Não há com o que comparar.</text>
  <text x="16" y="226" class="ok k">✓ USE UM CARTÃO</text>
  <rect x="16" y="238" width="140" height="62" rx="6" class="card"/>
  <text x="30" y="272" class="accent big">2.184</text>
  <text x="30" y="292" class="muted cap">pedidos hoje</text>

  <rect x="243" y="66" width="234" height="250" rx="8" class="box"/>
  <text x="259" y="90" class="bad k">✕ PIZZA DE DUAS FATIAS</text>
  <circle cx="320" cy="150" r="38" fill="#2563eb"/>
  <path d="M320 150 L320 112 A38 38 0 0 1 352 168 Z" fill="#93c5fd"/>
  <text x="259" y="212" class="muted cap">Ângulo para dizer o que uma</text>
  <text x="259" y="228" class="muted cap">frase resolve melhor.</text>
  <text x="259" y="254" class="ok k">✓ ESCREVA</text>
  <text x="259" y="280" class="ink h">68% renovaram.</text>
  <text x="259" y="300" class="muted cap">Um em cada três saiu.</text>

  <rect x="486" y="66" width="234" height="250" rx="8" class="box"/>
  <text x="502" y="90" class="bad k">✕ GRÁFICO PARA CONSULTAR</text>
  <line x1="520" y1="176" x2="700" y2="176" class="grid"/>
  <rect x="526" y="140" width="16" height="36" rx="2" class="bar"/>
  <rect x="548" y="128" width="16" height="48" rx="2" class="bar"/>
  <rect x="570" y="134" width="16" height="42" rx="2" class="bar"/>
  <rect x="592" y="120" width="16" height="56" rx="2" class="bar"/>
  <rect x="614" y="146" width="16" height="30" rx="2" class="bar"/>
  <rect x="636" y="132" width="16" height="44" rx="2" class="bar"/>
  <rect x="658" y="124" width="16" height="52" rx="2" class="bar"/>
  <rect x="680" y="138" width="16" height="38" rx="2" class="bar"/>
  <text x="502" y="200" class="muted cap">Quando a pessoa precisa do valor</text>
  <text x="502" y="216" class="muted cap">exato, barra é um obstáculo.</text>
  <text x="502" y="242" class="ok k">✓ USE UMA TABELA</text>
  <text x="502" y="266" class="muted cap">Ordenável, copiável, exata.</text>
  <text x="502" y="290" class="muted cap">Ou as duas: gráfico para ver a</text>
  <text x="502" y="306" class="muted cap">forma, tabela para ler o número.</text>

  <text x="0" y="352" class="muted cap">A pergunta que antecede tudo: a pessoa vem aqui <tspan class="ink h">perceber um padrão</tspan> ou <tspan class="ink h">consultar um valor</tspan>? Padrão pede</text>
  <text x="0" y="370" class="muted cap">gráfico; consulta pede tabela. Quase todo painel ruim tenta fazer as duas coisas com o mesmo componente.</text>
</svg>
