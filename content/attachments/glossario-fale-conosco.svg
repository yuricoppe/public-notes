<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Página de contato com formulário curto à esquerda, canais diretos com horário de atendimento à direita e a expectativa de prazo de resposta declarada">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Fale conosco</text>
  <text x="0" y="44" class="muted cap">Quem chega aqui já tentou outra coisa antes. O formulário não pode ser mais um obstáculo</text>

  <rect x="0" y="70" width="360" height="236" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="16" y="96" font-size="12" font-weight="700" fill="#1f2937">Envie uma mensagem</text>

  <text x="16" y="120" font-size="9" fill="#6b7280">Assunto</text>
  <rect x="16" y="126" width="328" height="26" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="26" y="143" font-size="10" fill="#1f2937">Problema com um pedido</text>
  <path d="M 322 136 L 326 140 L 330 136" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>

  <text x="16" y="170" font-size="9" fill="#6b7280">E-mail</text>
  <rect x="16" y="176" width="328" height="26" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  <text x="16" y="220" font-size="9" fill="#6b7280">Mensagem</text>
  <rect x="16" y="226" width="328" height="42" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>

  <rect x="16" y="278" width="90" height="16" rx="8" fill="#dbeafe"/>
  <text x="61" y="290" font-size="8" fill="#1e40af" text-anchor="middle">Resposta em 1 dia útil</text>
  <rect x="254" y="276" width="90" height="20" rx="5" fill="#2563eb"/>
  <text x="299" y="290" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">Enviar</text>

  <rect x="380" y="70" width="340" height="236" rx="8" class="card"/>
  <text x="396" y="96" font-size="12" font-weight="700" fill="#1f2937">Ou fale direto</text>

  <circle cx="406" cy="126" r="12" fill="#dbeafe"/>
  <text x="428" y="123" class="ink an">(11) 4000-0000</text>
  <text x="428" y="139" class="muted sm">Seg a sex, 9h &#224;s 18h &#183; link tel: no celular</text>

  <circle cx="406" cy="176" r="12" fill="#dbeafe"/>
  <text x="428" y="173" class="ink an">ajuda@exemplo.com.br</text>
  <text x="428" y="189" class="muted sm">Endereço clicável, não uma imagem</text>

  <circle cx="406" cy="226" r="12" fill="#dbeafe"/>
  <text x="428" y="223" class="ink an">Chat, das 9h às 18h</text>
  <text x="428" y="239" class="muted sm">Fora do horário, some — não fica morto</text>

  <circle cx="406" cy="276" r="12" fill="#dbeafe"/>
  <text x="428" y="273" class="ink an">Central de ajuda</text>
  <text x="428" y="289" class="muted sm">Antes do formulário: resolve sem espera</text>

  <text x="0" y="342" class="muted cap">A pergunta que o formulário sempre deixa no ar é "quando alguém responde?". Dizer o prazo — e cumprir —</text>
  <text x="0" y="360" class="muted cap">vale mais do que qualquer campo extra. E o assunto em lista pronta roteia melhor do que texto livre.</text></svg>
