<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="Os três níveis de um painel além do relatório estático: relatar, que apenas mostra o número; explorar, que deixa mudar o período e o recorte; e concluir, que diz em uma frase o que o dado significa. O exemplo do artigo é o aplicativo Saúde do iOS.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .screen{ fill: #111827; stroke: #374151; stroke-width: 1; }
    .mark  { fill: #f97316; }
    .dim   { fill: #4b5563; }
    .accent{ fill: #2563eb; }
    .line  { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .h   { font-size: 14px; font-weight: 700; }
    .why { font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    .tiny{ font-size: 9px; }
    .k   { font-size: 10.5px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .screen { fill: #0b0f17; stroke: #374151; }
      .accent { fill: #60a5fa; }
      .line { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Relatar, explorar, concluir</text>
  <text x="0" y="44" class="muted cap">O último item da lista, e o mais ambicioso: o painel que só relata parou no meio do caminho</text>

  <rect x="0" y="62" width="230" height="212" rx="8" class="card"/>
  <text x="16" y="86" class="accent k">1 · RELATAR</text>
  <text x="16" y="108" class="ink h">Aqui está o número</text>
  <rect x="16" y="122" width="198" height="106" rx="6" class="screen"/>
  <text x="28" y="142" class="tiny" fill="#f97316">Passos</text>
  <text x="28" y="166" fill="#ffffff" font-size="20" font-weight="700">3.644</text>
  <text x="82" y="166" class="tiny" fill="#9ca3af">passos</text>
  <line x1="28" y1="178" x2="202" y2="178" stroke="#374151"/>
  <text x="28" y="196" class="tiny" fill="#f97316">Distância</text>
  <text x="28" y="216" fill="#ffffff" font-size="16" font-weight="700">2,5 km</text>
  <text x="16" y="250" class="muted why">A pessoa lê e sai. Se ela quiser</text>
  <text x="16" y="265" class="muted why">saber se é muito ou pouco, azar.</text>

  <path d="M230 168 H 244" class="line" marker-end="url(#a)"/>

  <rect x="245" y="62" width="230" height="212" rx="8" class="card"/>
  <text x="261" y="86" class="accent k">2 · EXPLORAR</text>
  <text x="261" y="108" class="ink h">Mude o recorte</text>
  <rect x="261" y="122" width="198" height="106" rx="6" class="screen"/>
  <rect x="271" y="130" width="30" height="14" rx="3" fill="#374151"/><text x="281" y="140" class="tiny" fill="#9ca3af">D</text>
  <rect x="303" y="130" width="30" height="14" rx="3" fill="#6b7280"/><text x="313" y="140" class="tiny" fill="#ffffff">S</text>
  <rect x="335" y="130" width="30" height="14" rx="3" fill="#374151"/><text x="345" y="140" class="tiny" fill="#9ca3af">M</text>
  <rect x="367" y="130" width="30" height="14" rx="3" fill="#374151"/><text x="377" y="140" class="tiny" fill="#9ca3af">A</text>
  <text x="271" y="160" class="tiny" fill="#9ca3af">MÉDIA</text>
  <text x="271" y="178" fill="#ffffff" font-size="15" font-weight="700">3.238</text>
  <rect x="271" y="196" width="14" height="24" class="mark"/>
  <rect x="291" y="188" width="14" height="32" class="mark"/>
  <rect x="311" y="204" width="14" height="16" class="mark"/>
  <rect x="331" y="212" width="14" height="8" class="mark"/>
  <rect x="351" y="200" width="14" height="20" class="mark"/>
  <rect x="371" y="208" width="14" height="12" class="mark"/>
  <rect x="391" y="192" width="14" height="28" class="mark"/>
  <text x="261" y="250" class="muted why">Dia, semana, mês, ano. A pessoa</text>
  <text x="261" y="265" class="muted why">acha o padrão sozinha.</text>

  <path d="M475 168 H 489" class="line" marker-end="url(#a)"/>

  <rect x="490" y="62" width="230" height="212" rx="8" class="card"/>
  <text x="506" y="86" class="accent k">3 · CONCLUIR</text>
  <text x="506" y="108" class="ink h">O que isso significa</text>
  <rect x="506" y="122" width="198" height="106" rx="6" class="screen"/>
  <text x="518" y="142" class="tiny" fill="#f97316">Passos</text>
  <text x="518" y="162" class="tiny" fill="#ffffff">Você andou menos esta semana</text>
  <text x="518" y="176" class="tiny" fill="#ffffff">do que na semana passada.</text>
  <text x="518" y="198" fill="#ffffff" font-size="14" font-weight="700">3.238</text>
  <text x="556" y="198" class="tiny" fill="#9ca3af">por dia</text>
  <rect x="518" y="206" width="60" height="7" class="mark"/>
  <text x="584" y="212" class="tiny" fill="#9ca3af">esta semana</text>
  <rect x="518" y="217" width="150" height="7" class="dim"/>
  <text x="506" y="250" class="muted why">A frase é o produto. É também a</text>
  <text x="506" y="265" class="muted why">camada que serve a mais gente.</text>

  <text x="0" y="300" class="muted cap">O exemplo do artigo é o app Saúde do iOS — que é, por outros motivos, o melhor caso público de</text>
  <text x="0" y="318" class="muted cap">acessibilidade em dataviz. Uma ressalva que a lista não faz: não esconda o dado atrás da interação.</text>
  <text x="0" y="336" class="muted cap">O que só existe no hover exclui teclado, toque e leitor de tela.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
