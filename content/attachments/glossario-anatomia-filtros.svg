<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="Painel de filtros anotado: chips de filtros ativos com opção de limpar tudo, contagem de resultados, contagem por opção no painel lateral e aviso de atualização para leitores de tela">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .badge { fill: #2563eb; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 12px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Painel de filtros</text>
  <text x="0" y="44" class="muted cap">Filtrar é fácil. O difícil é a pessoa saber o que está aplicado, quanto sobrou e como voltar atrás</text>

  <!-- container -->
  <rect x="0" y="66" width="720" height="188" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="1" y="67" width="199" height="186" fill="#f9fafb"/>
  <line x1="200" y1="66" x2="200" y2="254" stroke="#e5e7eb" stroke-width="1"/>

  <!-- sidebar -->
  <text x="16" y="90" font-size="12" font-weight="700" fill="#1f2937">Filtros</text>
  <text x="16" y="114" font-size="10" font-weight="700" fill="#6b7280">MARCA</text>
  <rect x="16" y="124" width="13" height="13" rx="3" fill="#2563eb"/>
  <path d="M 19 130.5 L 21.5 133 L 26 128" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="38" y="135" font-size="11" fill="#1f2937">Sony (24)</text>
  <rect x="16" y="146" width="13" height="13" rx="3" fill="#2563eb"/>
  <path d="M 19 152.5 L 21.5 155 L 26 150" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="38" y="157" font-size="11" fill="#1f2937">JBL (12)</text>
  <rect x="16" y="168" width="13" height="13" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="38" y="179" font-size="11" fill="#9ca3af">Bose (0)</text>

  <text x="16" y="206" font-size="10" font-weight="700" fill="#6b7280">PREÇO</text>
  <line x1="16" y1="222" x2="184" y2="222" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="44" y1="222" x2="140" y2="222" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44" cy="222" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="140" cy="222" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="16" y="244" font-size="10" fill="#6b7280">R$ 100</text>
  <text x="184" y="244" font-size="10" fill="#6b7280" text-anchor="end">R$ 800</text>

  <!-- results area -->
  <rect x="216" y="82" width="76" height="22" rx="11" fill="#dbeafe"/>
  <text x="226" y="97" font-size="10" fill="#1e40af">Sony</text>
  <text x="276" y="97" font-size="10" fill="#1e40af">✕</text>
  <rect x="300" y="82" width="66" height="22" rx="11" fill="#dbeafe"/>
  <text x="310" y="97" font-size="10" fill="#1e40af">JBL</text>
  <text x="350" y="97" font-size="10" fill="#1e40af">✕</text>
  <rect x="374" y="82" width="116" height="22" rx="11" fill="#dbeafe"/>
  <text x="384" y="97" font-size="10" fill="#1e40af">R$ 100–800</text>
  <text x="474" y="97" font-size="10" fill="#1e40af">✕</text>
  <text x="504" y="97" font-size="11" fill="#2563eb">Limpar tudo</text>

  <text x="216" y="130" font-size="13" font-weight="700" fill="#1f2937">128 resultados</text>
  <text x="700" y="130" font-size="11" fill="#6b7280" text-anchor="end">Ordenar: relevância</text>

  <rect x="216" y="146" width="150" height="94" rx="4" fill="#f3f4f6"/>
  <rect x="376" y="146" width="150" height="94" rx="4" fill="#f3f4f6"/>
  <rect x="536" y="146" width="150" height="94" rx="4" fill="#f3f4f6"/>

  <!-- badges -->
  <circle cx="530" cy="70" r="10" class="badge"/><text x="526.5" y="74" class="num">1</text>
  <circle cx="312" cy="125" r="10" class="badge"/><text x="308.5" y="129" class="num">2</text>
  <circle cx="112" cy="130" r="10" class="badge"/><text x="108.5" y="134" class="num">3</text>
  <circle cx="700" cy="192" r="10" class="badge"/><text x="696.5" y="196" class="num">4</text>

  <!-- rules -->
  <circle cx="10" cy="290" r="10" class="badge"/><text x="6.5" y="294" class="num">1</text>
  <text x="32" y="294" class="ink h">Filtros ativos sempre visíveis</text>
  <text x="0" y="316" class="muted an">Um chip por filtro, cada um removível sozinho, mais</text>
  <text x="0" y="332" class="muted an">um "limpar tudo" que não obriga a desmarcar item a item.</text>

  <circle cx="378" cy="290" r="10" class="badge"/><text x="374.5" y="294" class="num">2</text>
  <text x="400" y="294" class="ink h">Contagem antes e depois</text>
  <text x="368" y="316" class="muted an">"128 resultados" é o que diz se o filtro fez efeito.</text>
  <text x="368" y="332" class="muted an">Sem número, aplicar filtro é apostar às cegas.</text>

  <circle cx="10" cy="356" r="10" class="badge"/><text x="6.5" y="360" class="num">3</text>
  <text x="32" y="360" class="ink h">Contagem por opção</text>
  <text x="0" y="382" class="muted an">"Sony (24)" evita o beco sem saída. E "Bose (0)"</text>
  <text x="0" y="398" class="muted an">desabilitado é melhor que Bose escondido.</text>

  <circle cx="378" cy="356" r="10" class="badge"/><text x="374.5" y="360" class="num">4</text>
  <text x="400" y="360" class="ink h">Anuncie a atualização</text>
  <text x="368" y="382" class="muted an">A lista muda sem recarregar a página: sem aria-live,</text>
  <text x="368" y="398" class="muted an">quem usa leitor de tela não percebe que algo mudou.</text>
</svg>
