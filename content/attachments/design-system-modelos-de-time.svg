<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Os três modelos de time para escalar um design system segundo Nathan Curtis: solitário, centralizado e federado, com quem produz o sistema em cada um e a fraqueza característica de cada arranjo">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.3; }
    .prod  { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
    .sys   { fill: #2563eb; }
    .line  { stroke: #9ca3af; stroke-width: 1.3; fill: none; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 15px; font-weight: 700; }
    .k   { font-size: 11.5px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .prod { fill: #374151; stroke: #6b7280; }
      .sys { fill: #60a5fa; }
      .accent { fill: #60a5fa; }
      .line { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Quem produz o sistema</text>
  <text x="0" y="44" class="muted cap">Os três modelos de Nathan Curtis. O quadrado azul é quem decide o sistema; o cinza, times de produto.</text>

  <rect x="0" y="66" width="230" height="270" rx="8" class="box"/>
  <text x="18" y="92" class="ink h">Solitário</text>
  <rect x="18" y="106" width="60" height="34" rx="5" class="sys"/>
  <rect x="18" y="150" width="60" height="26" rx="5" class="prod"/>
  <rect x="86" y="150" width="60" height="26" rx="5" class="prod"/>
  <rect x="154" y="150" width="58" height="26" rx="5" class="prod"/>
  <path d="M48 140 V 150" class="line"/>
  <text x="18" y="204" class="muted cap">Um time faz para si e</text>
  <text x="18" y="222" class="muted cap">deixa os outros usarem.</text>
  <text x="18" y="252" class="accent k">A FRAQUEZA</text>
  <text x="18" y="274" class="muted cap">O sistema evolui só na</text>
  <text x="18" y="292" class="muted cap">direção do produto dono.</text>
  <text x="18" y="310" class="muted cap">Quem adota fica refém.</text>

  <rect x="245" y="66" width="230" height="270" rx="8" class="box"/>
  <text x="263" y="92" class="ink h">Centralizado</text>
  <rect x="263" y="106" width="194" height="34" rx="5" class="sys"/>
  <rect x="263" y="150" width="60" height="26" rx="5" class="prod"/>
  <rect x="331" y="150" width="60" height="26" rx="5" class="prod"/>
  <rect x="399" y="150" width="58" height="26" rx="5" class="prod"/>
  <path d="M293 140 V 150 M361 140 V 150 M428 140 V 150" class="line"/>
  <text x="263" y="204" class="muted cap">Um time dedicado serve</text>
  <text x="263" y="222" class="muted cap">todos e não faz produto.</text>
  <text x="263" y="252" class="accent k">A FRAQUEZA</text>
  <text x="263" y="274" class="muted cap">Sem contexto real de</text>
  <text x="263" y="292" class="muted cap">produto, e sem influência</text>
  <text x="263" y="310" class="muted cap">sobre as decisões deles.</text>

  <rect x="490" y="66" width="230" height="270" rx="8" class="box"/>
  <text x="508" y="92" class="ink h">Federado</text>
  <rect x="508" y="150" width="60" height="26" rx="5" class="prod"/>
  <rect x="576" y="150" width="60" height="26" rx="5" class="prod"/>
  <rect x="644" y="150" width="58" height="26" rx="5" class="prod"/>
  <rect x="524" y="106" width="26" height="18" rx="4" class="sys"/>
  <rect x="592" y="106" width="26" height="18" rx="4" class="sys"/>
  <rect x="660" y="106" width="26" height="18" rx="4" class="sys"/>
  <path d="M537 124 V 150 M605 124 V 150 M673 124 V 150 M537 115 H 660" class="line"/>
  <text x="508" y="204" class="muted cap">Os melhores designers de</text>
  <text x="508" y="222" class="muted cap">cada produto decidem juntos.</text>
  <text x="508" y="252" class="accent k">A FRAQUEZA</text>
  <text x="508" y="274" class="muted cap">Cozinheiros demais, lealdade</text>
  <text x="508" y="292" class="muted cap">dividida e decisão sem</text>
  <text x="508" y="310" class="muted cap">registro de por quê.</text>

  <text x="0" y="368" class="muted cap">Nenhum é o certo. O centralizado precisa de gente de produto por perto; o federado precisa de alguém no</text>
  <text x="0" y="386" class="muted cap">centro documentando e comunicando, ou vira conversa que ninguém consegue reconstituir depois.</text>
</svg>
