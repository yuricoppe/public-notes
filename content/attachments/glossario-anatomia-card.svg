<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Anatomia de um card anotada em cinco partes: mídia, badge de status, título, metadados e ação, com a regra de consistência entre cards do mesmo grupo">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .badge { fill: #2563eb; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 12px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Anatomia de um card</text>
  <text x="0" y="44" class="muted cap">Card serve para comparar. Tudo aqui existe para que dois cards lado a lado possam ser lidos como par</text>

  <!-- card -->
  <rect x="40" y="80" width="280" height="250" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="41" y="81" width="278" height="108" rx="8" fill="#e5e7eb"/>
  <rect x="41" y="170" width="278" height="19" fill="#e5e7eb"/>
  <path d="M 130 160 L 165 122 L 190 152 L 205 138 L 235 160 Z" fill="#9ca3af"/>
  <circle cx="205" cy="110" r="10" fill="#9ca3af"/>
  <rect x="56" y="94" width="46" height="20" rx="10" fill="#2563eb"/>
  <text x="66" y="108" font-size="10" font-weight="700" fill="#ffffff">Novo</text>

  <text x="56" y="219" font-size="15" font-weight="700" fill="#1f2937">Fone de ouvido X200</text>
  <text x="56" y="240" font-size="12" fill="#6b7280">Sem fio · 30h de bateria</text>
  <text x="56" y="268" font-size="16" font-weight="700" fill="#1f2937">R$ 349</text>
  <rect x="56" y="284" width="120" height="32" rx="6" fill="#2563eb"/>
  <text x="80" y="305" font-size="12" font-weight="600" fill="#ffffff">Adicionar</text>

  <!-- number badges -->
  <circle cx="20" cy="135" r="10" class="badge"/>
  <text x="16.5" y="139" class="num">1</text>
  <circle cx="20" cy="104" r="10" class="badge"/>
  <text x="16.5" y="108" class="num">2</text>
  <circle cx="20" cy="214" r="10" class="badge"/>
  <text x="16.5" y="218" class="num">3</text>
  <circle cx="20" cy="252" r="10" class="badge"/>
  <text x="16.5" y="256" class="num">4</text>
  <circle cx="20" cy="300" r="10" class="badge"/>
  <text x="16.5" y="304" class="num">5</text>

  <!-- annotations -->
  <circle cx="372" cy="96" r="10" class="badge"/>
  <text x="368.5" y="100" class="num">1</text>
  <text x="392" y="100" class="ink h">Mídia (opcional)</text>
  <text x="392" y="120" class="muted an">Proporção idêntica em todos os cards do grupo.</text>
  <text x="392" y="136" class="muted an">É o que mantém a grade alinhada.</text>

  <circle cx="372" cy="160" r="10" class="badge"/>
  <text x="368.5" y="164" class="num">2</text>
  <text x="392" y="164" class="ink h">Badge de status</text>
  <text x="392" y="184" class="muted an">Uma palavra, categórica. Se precisa de frase,</text>
  <text x="392" y="200" class="muted an">não era badge.</text>

  <circle cx="372" cy="224" r="10" class="badge"/>
  <text x="368.5" y="228" class="num">3</text>
  <text x="392" y="228" class="ink h">Título</text>
  <text x="392" y="248" class="muted an">O que identifica o item. Reserve a altura de</text>
  <text x="392" y="264" class="muted an">duas linhas mesmo quando só uma é usada.</text>

  <circle cx="372" cy="288" r="10" class="badge"/>
  <text x="368.5" y="292" class="num">4</text>
  <text x="392" y="292" class="ink h">Metadados</text>
  <text x="392" y="312" class="muted an">Os mesmos campos, na mesma ordem, em todos</text>
  <text x="392" y="328" class="muted an">os cards. Sem isso não há comparação.</text>

  <circle cx="372" cy="352" r="10" class="badge"/>
  <text x="368.5" y="356" class="num">5</text>
  <text x="392" y="356" class="ink h">Ação</text>
  <text x="392" y="376" class="muted an">Ou o card inteiro é clicável, ou o botão é —</text>
  <text x="392" y="392" class="muted an">os dois juntos viram alvos aninhados.</text>
</svg>
