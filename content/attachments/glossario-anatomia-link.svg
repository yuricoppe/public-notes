<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Estados de um link — normal, hover, visitado e foco — a indicação de link externo e a diferença entre texto descritivo e clique aqui">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Links</text>
  <text x="0" y="44" class="muted cap">O sublinhado não é enfeite herdado dos anos 90: é a única pista que não depende de enxergar cor</text>

  <rect x="0" y="70" width="430" height="128" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="16" y="96" class="ink h">Os quatro estados</text>

  <text x="16" y="126" font-size="12" fill="#2563eb">link normal</text>
  <line x1="16" y1="130" x2="88" y2="130" stroke="#2563eb" stroke-width="1"/>
  <text x="16" y="146" class="muted sm">cor + sublinhado</text>

  <text x="130" y="126" font-size="12" fill="#1d4ed8">com o mouse</text>
  <line x1="130" y1="130" x2="205" y2="130" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="146" class="muted sm">tom mais escuro</text>

  <text x="250" y="126" font-size="12" fill="#7c3aed">já visitado</text>
  <line x1="250" y1="130" x2="315" y2="130" stroke="#7c3aed" stroke-width="1"/>
  <text x="250" y="146" class="muted sm">poupa revisita</text>

  <rect x="340" y="112" width="72" height="22" rx="3" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <text x="346" y="127" font-size="12" fill="#2563eb">com foco</text>
  <text x="340" y="152" class="muted sm">anel visível</text>

  <text x="16" y="180" class="accent an">"Visitado" é o estado que quase todo design system esquece — e é o mais útil em lista longa.</text>

  <rect x="0" y="214" width="430" height="90" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="16" y="240" class="ink h">Quando o destino sai do padrão</text>
  <text x="16" y="266" font-size="11" fill="#2563eb">Relatório completo</text>
  <line x1="16" y1="270" x2="120" y2="270" stroke="#2563eb" stroke-width="1"/>
  <path d="M 128 268 L 138 258 M 130 258 L 138 258 L 138 266" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-linecap="round"/>
  <text x="150" y="266" class="muted sm">abre em outra aba</text>

  <text x="16" y="292" font-size="11" fill="#2563eb">Manual de uso (PDF, 2,4 MB)</text>
  <line x1="16" y1="296" x2="170" y2="296" stroke="#2563eb" stroke-width="1"/>
  <text x="186" y="292" class="muted sm">formato e peso no próprio texto</text>

  <rect x="460" y="70" width="260" height="112" rx="6" class="card"/>
  <text x="476" y="94" class="warn h">Não diz nada sozinho</text>
  <text x="476" y="118" font-size="11" fill="#6b7280">Para ver o relatório,</text>
  <text x="476" y="134" font-size="11" fill="#2563eb">clique aqui</text>
  <line x1="476" y1="138" x2="544" y2="138" stroke="#2563eb" stroke-width="1"/>
  <text x="476" y="160" class="muted sm">Numa lista de links, vira</text>
  <text x="476" y="174" class="muted sm">"clique aqui, clique aqui...".</text>

  <rect x="460" y="192" width="260" height="112" rx="6" class="card"/>
  <text x="476" y="216" class="ok h">Funciona fora de contexto</text>
  <text x="476" y="240" font-size="11" fill="#6b7280">Veja o</text>
  <text x="516" y="240" font-size="11" fill="#2563eb">relatório do 2&#186; trimestre</text>
  <line x1="516" y1="244" x2="666" y2="244" stroke="#2563eb" stroke-width="1"/>
  <text x="476" y="266" class="muted sm">Leitores de tela oferecem "listar</text>
  <text x="476" y="280" class="muted sm">todos os links" — e é assim que</text>
  <text x="476" y="294" class="muted sm">muita gente navega.</text>

  <text x="0" y="340" class="ink h">Link ou botão?</text>
  <text x="0" y="360" class="muted an">Link leva a outro lugar e aceita abrir em nova aba. Botão faz algo acontecer aqui. Trocar os dois quebra o</text>
  <text x="0" y="376" class="muted an">clique do meio, o "abrir em nova aba" e a tecla Enter — que aciona link, enquanto Espaço aciona botão.</text></svg>
