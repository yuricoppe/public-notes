<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Os quatro critérios da busca avançada: inclusão, exclusão, mutuamente exclusivo com OU, e aditivo com E, cada um com diagrama de conjuntos e exemplo">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .setL  { fill: #2563eb; opacity: .30; }
    .setR  { fill: #2563eb; opacity: .30; }
    .setOut{ fill: none; stroke: #6b7280; stroke-width: 1.5; }
    .hit   { fill: #2563eb; opacity: .85; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .setL, .setR { fill: #60a5fa; opacity: .28; }
      .hit { fill: #60a5fa; opacity: .9; }
      .setOut { stroke: #9ca3af; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Os quatro critérios da busca avançada</text>
  <text x="0" y="44" class="muted cap">O lugar dela é a página de resultados, como saída para quem já falhou — nunca a página inicial</text>

  <!-- 1 inclusão -->
  <rect x="0" y="66" width="168" height="176" rx="8" class="box"/>
  <text x="16" y="92" class="ink h">Inclusão</text>
  <circle cx="84" cy="146" r="38" class="hit"/>
  <text x="16" y="208" class="muted cap">contém</text>
  <text x="16" y="228" class="ink mono">tipo = artigo</text>

  <!-- 2 exclusão -->
  <rect x="184" y="66" width="168" height="176" rx="8" class="box"/>
  <text x="200" y="92" class="ink h">Exclusão</text>
  <circle cx="268" cy="146" r="38" class="setOut"/>
  <line x1="241" y1="119" x2="295" y2="173" class="setOut"/>
  <text x="200" y="208" class="muted cap">não contém</text>
  <text x="200" y="228" class="ink mono">-arquivado</text>

  <!-- 3 OU -->
  <rect x="368" y="66" width="168" height="176" rx="8" class="box"/>
  <text x="384" y="92" class="ink h">Mutuamente excl. (ou)</text>
  <circle cx="432" cy="146" r="34" class="setL"/>
  <circle cx="472" cy="146" r="34" class="setR"/>
  <text x="384" y="208" class="muted cap">um ou outro</text>
  <text x="384" y="228" class="ink mono">vermelho ou azul</text>

  <!-- 4 E -->
  <rect x="552" y="66" width="168" height="176" rx="8" class="box"/>
  <text x="568" y="92" class="ink h">Aditivo (e)</text>
  <circle cx="616" cy="146" r="34" class="setOut"/>
  <circle cx="656" cy="146" r="34" class="setOut"/>
  <path d="M636 117 a34 34 0 0 1 0 58 a34 34 0 0 1 0 -58" class="hit"/>
  <text x="568" y="208" class="muted cap">os dois ao mesmo tempo</text>
  <text x="568" y="228" class="ink mono">artigo E acadêmico</text>

  <text x="0" y="272" class="muted cap">São operações de conjunto, e é aí que mora o problema: quase ninguém pensa em conjuntos ao procurar algo.</text>
  <text x="0" y="292" class="muted cap">Por isso a busca avançada otimiza a tentativa que menos importa.</text>
</svg>
