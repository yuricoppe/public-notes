<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Toast anotado com mensagem curta, ação de desfazer e fechar, empilhamento de vários toasts e a régua de quando não usar toast">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Toast</text>
  <text x="0" y="44" class="muted cap">Aparece, diz uma coisa e some. Tudo o que exige leitura atenta ou decisão não cabe aqui</text>

  <rect x="0" y="70" width="430" height="180" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="16" y="86" width="180" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="16" y="102" width="398" height="5" rx="2.5" fill="#f3f4f6"/>
  <rect x="16" y="114" width="360" height="5" rx="2.5" fill="#f3f4f6"/>

  <rect x="16" y="140" width="300" height="44" rx="8" fill="#1f2937"/>
  <circle cx="40" cy="162" r="9" fill="#34d399"/>
  <path d="M 36 162 L 39 165 L 44 159" fill="none" stroke="#1f2937" stroke-width="1.7" stroke-linecap="round"/>
  <text x="58" y="166" font-size="11" fill="#ffffff">Pedido 12342 arquivado</text>
  <text x="230" y="166" font-size="11" font-weight="700" fill="#93c5fd">Desfazer</text>
  <text x="300" y="166" font-size="11" fill="#9ca3af">&#10005;</text>

  <rect x="24" y="192" width="284" height="34" rx="8" fill="#1f2937" opacity="0.55"/>
  <text x="62" y="213" font-size="10" fill="#ffffff" opacity="0.9">Etiqueta gerada</text>
  <rect x="32" y="230" width="268" height="12" rx="6" fill="#1f2937" opacity="0.25"/>

  <text x="460" y="94" class="ink h">Uma frase, sem rolagem</text>
  <text x="460" y="114" class="muted an">Se não cabe em uma linha e meia,</text>
  <text x="460" y="130" class="muted an">era alerta inline ou banner.</text>

  <text x="460" y="164" class="accent h">"Desfazer" vale mais que confirmar</text>
  <text x="460" y="184" class="muted an">Deixe a ação acontecer e ofereça a volta</text>
  <text x="460" y="200" class="muted an">no toast. Bem mais barato que um modal</text>
  <text x="460" y="216" class="muted an">de confirmação antes de cada clique.</text>

  <text x="460" y="250" class="ink h">Empilhe, não sobreponha</text>
  <text x="460" y="270" class="muted an">Vários seguidos entram em fila, na mesma</text>
  <text x="460" y="286" class="muted an">posição de sempre. Um cobrindo o outro</text>
  <text x="460" y="302" class="muted an">apaga a mensagem anterior.</text>

  <text x="0" y="284" class="muted sm">Empilhamento: o mais novo por cima,</text>
  <text x="0" y="300" class="muted sm">os antigos recuam e saem.</text>

  <rect x="0" y="316" width="720" height="52" rx="6" class="card"/>
  <text x="16" y="338" class="warn h">Quando não é toast</text>
  <text x="130" y="338" class="muted an">Erro que impede continuar &#183; qualquer coisa que exija decisão &#183; informação que</text>
  <text x="130" y="356" class="muted an">a pessoa vai precisar reler. Some em segundos e não deixa rastro — isso é o recurso e o limite.</text></svg>
