<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="As camadas do ecossistema de design system descritas por Brad Frost, da base de padrões web até o produto: núcleo do design system, implementação específica de tecnologia, receitas, componentes inteligentes e produto, com influência nos dois sentidos">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.3; }
    .core  { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.6; }
    .base  { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.4; }
    .accent{ fill: #2563eb; }
    .ok    { fill: #10b981; }
    .line  { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11.5px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .core { fill: #1e293b; stroke: #60a5fa; }
      .base { fill: #14302a; stroke: #34d399; }
      .accent { fill: #60a5fa; }
      .ok { fill: #34d399; }
      .line { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O ecossistema em camadas</text>
  <text x="0" y="44" class="muted cap">Cada camada acima da primeira é opcional. Só se acrescenta quando aparece uma necessidade real.</text>

  <rect x="90" y="66" width="630" height="48" rx="8" class="box"/>
  <text x="106" y="88" class="ink h">Produto</text>
  <text x="106" y="106" class="muted cap">o que de fato é lançado — a única camada que o cliente vê</text>

  <rect x="90" y="122" width="630" height="48" rx="8" class="box"/>
  <text x="106" y="144" class="ink h">Componentes inteligentes <tspan class="muted cap">· opcional</tspan></text>
  <text x="106" y="162" class="muted cap">componentes embrulhados em lógica e dados: busca conectada, carrinho, autenticação</text>

  <rect x="90" y="178" width="630" height="48" rx="8" class="box"/>
  <text x="106" y="200" class="ink h">Receitas <tspan class="muted cap">· opcional</tspan></text>
  <text x="106" y="218" class="muted cap">composições que só fazem sentido neste produto: CartaoDeProduto, CampoDeNome</text>

  <rect x="90" y="234" width="630" height="48" rx="8" class="box"/>
  <text x="106" y="256" class="ink h">Implementação por tecnologia <tspan class="muted cap">· opcional</tspan></text>
  <text x="106" y="274" class="muted cap">invólucros para React, Vue, SwiftUI — quando há mais de uma stack a servir</text>

  <rect x="90" y="290" width="630" height="62" rx="8" class="core"/>
  <text x="106" y="314" class="accent h">Núcleo do design system</text>
  <text x="106" y="336" class="muted cap">tokens · ícones · componentes de UI · site de referência com a documentação</text>

  <rect x="90" y="360" width="630" height="42" rx="8" class="base"/>
  <text x="106" y="386" class="ok h">HTML, CSS e padrões da plataforma</text>

  <path d="M50 96 V 380" class="line" marker-end="url(#dn)" marker-start="url(#up)"/>
  <g transform="translate(38 320) rotate(-90)">
    <text x="0" y="0" class="muted k">INFLUÊNCIA NOS DOIS SENTIDOS</text>
  </g>

  <text x="0" y="432" class="muted cap">O sistema informa os produtos; os produtos informam o sistema. Uma seta só, para baixo, descreve</text>
  <text x="0" y="450" class="muted cap">um sistema que vai envelhecer sozinho e ser abandonado.</text>

  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
