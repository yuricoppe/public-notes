<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Parágrafo legível: alinhado à esquerda com comprimento de linha controlado, contra a versão justificada com rios de espaço em branco e linha longa demais">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Parágrafo</text>
  <text x="0" y="44" class="muted cap">O elemento mais usado da interface, e o que mais sofre com decisões tomadas por engano</text>

  <text x="0" y="76" class="ok h">Alinhado à esquerda, linha entre 45 e 75 caracteres</text>
  <rect x="0" y="88" width="344" height="150" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="16" y="106" width="300" height="6" rx="3" fill="#d1d5db"/>
  <rect x="16" y="122" width="288" height="6" rx="3" fill="#d1d5db"/>
  <rect x="16" y="138" width="304" height="6" rx="3" fill="#d1d5db"/>
  <rect x="16" y="154" width="180" height="6" rx="3" fill="#d1d5db"/>
  <rect x="16" y="182" width="298" height="6" rx="3" fill="#d1d5db"/>
  <rect x="16" y="198" width="304" height="6" rx="3" fill="#d1d5db"/>
  <rect x="16" y="214" width="230" height="6" rx="3" fill="#d1d5db"/>
  <path d="M 16 100 L 320 100" class="lead"/>
  <text x="16" y="96" class="accent sm">borda direita irregular, espaçamento entre palavras constante</text>

  <text x="376" y="76" class="warn h">Justificado e largo demais</text>
  <rect x="376" y="88" width="344" height="150" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <rect x="392" y="106" width="150" height="6" rx="3" fill="#d1d5db"/>
  <rect x="556" y="106" width="148" height="6" rx="3" fill="#d1d5db"/>
  <rect x="392" y="122" width="100" height="6" rx="3" fill="#d1d5db"/>
  <rect x="508" y="122" width="196" height="6" rx="3" fill="#d1d5db"/>
  <rect x="392" y="138" width="180" height="6" rx="3" fill="#d1d5db"/>
  <rect x="586" y="138" width="118" height="6" rx="3" fill="#d1d5db"/>
  <rect x="392" y="154" width="120" height="6" rx="3" fill="#d1d5db"/>
  <rect x="528" y="154" width="176" height="6" rx="3" fill="#d1d5db"/>
  <rect x="392" y="170" width="200" height="6" rx="3" fill="#d1d5db"/>
  <rect x="606" y="170" width="98" height="6" rx="3" fill="#d1d5db"/>
  <path d="M 549 100 C 545 120 553 140 546 160 C 540 176 550 186 548 200" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <text x="392" y="216" class="warn sm">Os buracos se alinham verticalmente e formam "rios"</text>
  <text x="392" y="230" class="warn sm">que puxam o olho para baixo, atravessando as linhas.</text>

  <rect x="0" y="264" width="232" height="112" rx="6" class="card"/>
  <text x="14" y="288" class="ink h">Separe com margem</text>
  <rect x="14" y="302" width="180" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="14" y="313" width="160" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="14" y="336" width="180" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="14" y="347" width="140" height="5" rx="2.5" fill="#e5e7eb"/>
  <text x="14" y="370" class="muted sm">Margem inferior — ou recuo na primeira</text>

  <rect x="244" y="264" width="232" height="112" rx="6" class="card"/>
  <text x="258" y="288" class="warn h">Nunca os dois juntos</text>
  <rect x="258" y="302" width="180" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="258" y="313" width="160" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="282" y="336" width="156" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="258" y="347" width="140" height="5" rx="2.5" fill="#e5e7eb"/>
  <text x="258" y="370" class="muted sm">linha, mas não margem e recuo ao mesmo tempo.</text>

  <rect x="488" y="264" width="232" height="112" rx="6" class="card"/>
  <text x="502" y="288" class="ink h">Herdado da tipografia</text>
  <text x="502" y="308" class="muted an">Tamanho, altura de linha e cor</text>
  <text x="502" y="324" class="muted an">vêm dos tokens, não de decisão</text>
  <text x="502" y="340" class="muted an">local. Um parágrafo com estilo</text>
  <text x="502" y="356" class="muted an">próprio é quase sempre um</text>
  <text x="502" y="372" class="muted an">componente disfarçado.</text></svg>
