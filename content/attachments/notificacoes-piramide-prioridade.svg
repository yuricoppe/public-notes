<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img" aria-label="Pirâmide de prioridade de alarmes recomendada pela EEMUA: 5 por cento de prioridade alta, 15 por cento média e 80 por cento baixa, com a observação de que a prioridade deve derivar da consequência de não responder">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .p1 { fill: #dc2626; }
    .p2 { fill: #f59e0b; }
    .p3 { fill: #64748b; }
    .inv { fill: #ffffff; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .num { font-size: 18px; font-weight: 700; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .p1 { fill: #ef4444; }
      .p2 { fill: #d97706; }
      .p3 { fill: #475569; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Prioridade é um orçamento, não um adjetivo</text>
  <text x="0" y="44" class="muted cap">Distribuição recomendada pela EEMUA 191 — três níveis, e a maior parte no degrau mais baixo</text>

  <rect x="0"   y="70" width="300" height="34" rx="4" class="p1"/>
  <text x="14"  y="93" class="inv num">5%</text>
  <text x="66"  y="93" class="inv h">Alta</text>

  <rect x="0"   y="112" width="300" height="60" rx="4" class="p2"/>
  <text x="14"  y="149" class="inv num">15%</text>
  <text x="76"  y="149" class="inv h">Média</text>

  <rect x="0"   y="180" width="300" height="110" rx="4" class="p3"/>
  <text x="14"  y="242" class="inv num">80%</text>
  <text x="86"  y="242" class="inv h">Baixa</text>

  <rect x="328" y="70" width="392" height="34" rx="6" class="box"/>
  <text x="344" y="92" class="muted cap">Se ninguém responder, alguém se machuca ou algo se perde.</text>

  <rect x="328" y="112" width="392" height="60" rx="6" class="box"/>
  <text x="344" y="136" class="muted cap">Se ninguém responder, o problema piora — mas ainda dá</text>
  <text x="344" y="156" class="muted cap">tempo de resolver depois.</text>

  <rect x="328" y="180" width="392" height="110" rx="6" class="box"/>
  <text x="344" y="204" class="muted cap">Se ninguém responder, nada de irreversível acontece.</text>
  <text x="344" y="228" class="muted cap">É aqui que mora quase tudo o que um produto quer dizer:</text>
  <text x="344" y="248" class="muted cap">novidades, sugestões, resumos, engajamento.</text>
  <text x="344" y="272" class="muted cap">Este degrau não deve tocar, vibrar nem bloquear.</text>

  <text x="0" y="314" class="muted cap">A regra é definir a prioridade pela consequência de não responder — nunca pelo quanto o time quer</text>
  <text x="0" y="332" class="muted cap">que a mensagem seja vista.</text>
</svg>
