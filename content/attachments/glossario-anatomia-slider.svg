<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Slider anotado com trilha, preenchimento, alça, valor visível e marcadores de passo, mais a comparação com um campo numérico quando a precisão importa">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Controle deslizante (slider)</text>
  <text x="0" y="44" class="muted cap">Excelente para "mais ou menos aqui". Péssimo para "exatamente 37"</text>

  <rect x="0" y="70" width="430" height="152" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="20" y="98" font-size="10" fill="#6b7280">Faixa de preço</text>
  <text x="410" y="98" font-size="11" font-weight="700" fill="#1f2937" text-anchor="end">R$ 100 &#8211; R$ 800</text>

  <line x1="30" y1="140" x2="400" y2="140" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
  <line x1="86" y1="140" x2="300" y2="140" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <circle cx="86" cy="140" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="300" cy="140" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="272" y="106" width="56" height="20" rx="4" fill="#1f2937"/>
  <text x="300" y="120" font-size="9" fill="#ffffff" text-anchor="middle">R$ 800</text>
  <path d="M 296 126 L 304 126 L 300 131 Z" fill="#1f2937"/>

  <line x1="30" y1="152" x2="30" y2="157" stroke="#d1d5db" stroke-width="1"/>
  <line x1="122" y1="152" x2="122" y2="157" stroke="#d1d5db" stroke-width="1"/>
  <line x1="215" y1="152" x2="215" y2="157" stroke="#d1d5db" stroke-width="1"/>
  <line x1="307" y1="152" x2="307" y2="157" stroke="#d1d5db" stroke-width="1"/>
  <line x1="400" y1="152" x2="400" y2="157" stroke="#d1d5db" stroke-width="1"/>
  <text x="30" y="172" font-size="9" fill="#6b7280" text-anchor="middle">0</text>
  <text x="400" y="172" font-size="9" fill="#6b7280" text-anchor="middle">2k</text>
  <text x="215" y="196" class="muted sm" text-anchor="middle">trilha &#183; preenchimento &#183; alça &#183; passo &#183; valor</text>

  <text x="460" y="94" class="ink h">O valor sempre visível</text>
  <text x="460" y="114" class="muted an">Sem ele, o slider é um chute. Balão ao</text>
  <text x="460" y="130" class="muted an">arrastar, ou número fixo ao lado.</text>

  <text x="460" y="164" class="ink h">Alça grande o bastante</text>
  <text x="460" y="184" class="muted an">Alvo de toque de 44px, mesmo que o</text>
  <text x="460" y="200" class="muted an">círculo desenhado seja menor.</text>

  <rect x="0" y="244" width="352" height="112" rx="6" class="card"/>
  <text x="16" y="268" class="ink h">Quando o slider é a escolha certa</text>
  <text x="16" y="288" class="muted an">Valor aproximado, com efeito imediato e visível:</text>
  <text x="16" y="304" class="muted an">volume, brilho, zoom, faixa de preço num filtro.</text>
  <text x="16" y="330" class="accent an">A pessoa julga o resultado, não o número.</text>

  <rect x="368" y="244" width="352" height="112" rx="6" class="card"/>
  <text x="384" y="268" class="warn h">Quando é campo numérico</text>
  <text x="384" y="288" class="muted an">Valor exato, faixa larga ou entrada repetida:</text>
  <text x="384" y="304" class="muted an">idade, quantidade, CEP, porcentagem exata.</text>
  <text x="384" y="330" class="accent an">Melhor ainda: os dois juntos, sincronizados.</text>

  <text x="0" y="374" class="muted cap">No teclado: setas movem de um passo, PageUp/PageDown de um salto, Home e End vão aos extremos. E o ARIA precisa de aria-valuenow, aria-valuemin e aria-valuemax.</text></svg>
