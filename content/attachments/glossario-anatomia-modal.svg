<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Anatomia de um modal anotada em cinco pontos: overlay que torna o fundo inerte, título que diz a consequência, duas saídas — botão fechar e tecla Escape —, verbo real no botão de ação e armadilha de foco do teclado">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .page  { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .bar   { fill: #e5e7eb; }
    .badge { fill: #2563eb; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 12px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Anatomia de um modal — e as cinco coisas que costumam faltar</text>
  <text x="0" y="44" class="muted cap">O modal é o componente mais caro da interface: ele suspende tudo o que a pessoa estava fazendo</text>

  <!-- page behind -->
  <rect x="0" y="86" width="420" height="248" rx="6" class="page"/>
  <rect x="16" y="102" width="240" height="8" rx="4" class="bar"/>
  <rect x="16" y="120" width="388" height="6" rx="3" class="bar"/>
  <rect x="16" y="134" width="360" height="6" rx="3" class="bar"/>
  <rect x="16" y="290" width="388" height="6" rx="3" class="bar"/>
  <rect x="16" y="304" width="300" height="6" rx="3" class="bar"/>

  <!-- overlay -->
  <rect x="0" y="86" width="420" height="248" rx="6" fill="#111827" opacity="0.55"/>

  <!-- dialog -->
  <rect x="60" y="128" width="300" height="164" rx="8" fill="#ffffff"/>
  <text x="82" y="162" font-size="15" font-weight="700" fill="#1f2937">Excluir 24 pedidos?</text>
  <text x="334" y="161" font-size="14" fill="#6b7280">✕</text>
  <text x="82" y="192" font-size="12" fill="#6b7280">Os pedidos e seus anexos serão removidos</text>
  <text x="82" y="210" font-size="12" fill="#6b7280">do sistema. Essa ação não pode ser desfeita.</text>
  <rect x="166" y="240" width="82" height="34" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="182" y="262" font-size="12" font-weight="600" fill="#1f2937">Cancelar</text>
  <rect x="258" y="240" width="80" height="34" rx="6" fill="#dc2626"/>
  <text x="275" y="262" font-size="12" font-weight="600" fill="#ffffff">Excluir</text>

  <!-- badges on mock -->
  <circle cx="24" cy="256" r="10" class="badge"/>
  <text x="20.5" y="260" class="num">1</text>
  <circle cx="70" cy="152" r="10" class="badge"/>
  <text x="66.5" y="156" class="num">2</text>
  <circle cx="352" cy="140" r="10" class="badge"/>
  <text x="348.5" y="144" class="num">3</text>
  <circle cx="352" cy="257" r="10" class="badge"/>
  <text x="348.5" y="261" class="num">4</text>
  <circle cx="70" cy="282" r="10" class="badge"/>
  <text x="66.5" y="286" class="num">5</text>

  <!-- annotations -->
  <circle cx="452" cy="96" r="10" class="badge"/>
  <text x="448.5" y="100" class="num">1</text>
  <text x="470" y="100" class="ink h">Overlay</text>
  <text x="470" y="118" class="muted an">Não é só escurecer: o conteúdo atrás fica</text>
  <text x="470" y="134" class="muted an">inerte, sem clique e sem tabulação.</text>

  <circle cx="452" cy="160" r="10" class="badge"/>
  <text x="448.5" y="164" class="num">2</text>
  <text x="470" y="164" class="ink h">Título que diz a consequência</text>
  <text x="470" y="182" class="muted an">"Excluir 24 pedidos?" — não "Atenção".</text>
  <text x="470" y="198" class="muted an">Ligado ao dialog por aria-labelledby.</text>

  <circle cx="452" cy="224" r="10" class="badge"/>
  <text x="448.5" y="228" class="num">3</text>
  <text x="470" y="228" class="ink h">Duas saídas, sempre</text>
  <text x="470" y="246" class="muted an">O ✕ explícito e a tecla Esc. Clicar fora é</text>
  <text x="470" y="262" class="muted an">um extra, nunca o único caminho.</text>

  <circle cx="452" cy="288" r="10" class="badge"/>
  <text x="448.5" y="292" class="num">4</text>
  <text x="470" y="292" class="ink h">Verbo real no botão</text>
  <text x="470" y="310" class="muted an">"Excluir", não "OK". O rótulo precisa</text>
  <text x="470" y="326" class="muted an">dizer o que acontece ao ser clicado.</text>

  <circle cx="452" cy="352" r="10" class="badge"/>
  <text x="448.5" y="356" class="num">5</text>
  <text x="470" y="356" class="ink h">Armadilha de foco</text>
  <text x="470" y="374" class="muted an">Tab circula dentro do dialog; ao fechar, o</text>
  <text x="470" y="390" class="muted an">foco volta ao botão que o abriu.</text>
</svg>
