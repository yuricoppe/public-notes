<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 652" width="720" height="652" role="img" aria-label="Seis erros frequentes em gráficos, cada um mostrado lado a lado com a correção: dois eixos verticais contra duas séries indexadas a uma base comum; escala arco-íris contra rampa de uma cor só; cor atribuída pelo ranking, que troca ao filtrar, contra cor presa à entidade; barras em três dimensões contra barras planas; número em cima de todo ponto contra rótulo só nos extremos; e valor disponível apenas no hover contra rótulo direto">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .plot  { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .axis  { stroke: #9ca3af; stroke-width: 1; }
    .mark  { fill: #2563eb; }
    .ln1   { stroke: #2563eb; stroke-width: 2; fill: none; }
    .ln2   { stroke: #0d9488; stroke-width: 2; fill: none; }
    .bad   { fill: #dc2626; }
    .ok    { fill: #10b981; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .why { font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    .tiny{ font-size: 9px; }
    .badge { font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .plot { fill: #111827; stroke: #374151; }
      .axis { stroke: #6b7280; }
      .mark { fill: #60a5fa; }
      .ln1 { stroke: #60a5fa; } .ln2 { stroke: #14b8a6; }
      .bad { fill: #f87171; } .ok { fill: #34d399; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Seis erros, e como cada um se parece</text>
  <text x="0" y="44" class="muted cap">À esquerda o defeito, à direita a correção. O dado é o mesmo nos dois lados de cada par.</text>

  <rect x="0" y="62" width="352" height="176" rx="8" class="card"/>
  <text x="16" y="86" class="ink h">Dois eixos verticais</text>
  <text x="16" y="104" class="muted why">O alinhamento entre as escalas é escolhido por quem</text>
  <text x="16" y="119" class="muted why">desenha — a correlação aparente é invenção.</text>
  <rect x="16" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="22" y="145" class="bad badge">✕</text>
  <text x="40" y="146" class="muted tiny">800k</text>
  <text x="140" y="146" class="muted tiny">30k</text>
  <line x1="38" y1="152" x2="38" y2="212" class="axis"/>
  <line x1="146" y1="152" x2="146" y2="212" class="axis"/>
  <path d="M44 204 L68 194 L92 184 L116 170 L142 158" class="ln1"/>
  <path d="M44 166 L68 174 L92 170 L116 188 L142 198" class="ln2"/>
  <rect x="184" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="190" y="145" class="ok badge">✓</text>
  <text x="208" y="146" class="muted tiny">as duas em base 100</text>
  <line x1="206" y1="152" x2="206" y2="208" class="axis"/>
  <line x1="206" y1="208" x2="326" y2="208" class="axis"/>
  <path d="M206 192 L236 186 L266 174 L296 164 L322 154" class="ln1"/>
  <path d="M206 192 L236 196 L266 194 L296 200 L322 204" class="ln2"/>

  <rect x="368" y="62" width="352" height="176" rx="8" class="card"/>
  <text x="384" y="86" class="ink h">Arco-íris para magnitude</text>
  <text x="384" y="104" class="muted why">Matiz não tem ordem: ninguém sabe se verde é mais</text>
  <text x="384" y="119" class="muted why">ou menos que laranja sem consultar a legenda.</text>
  <rect x="384" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="390" y="145" class="bad badge">✕</text>
  <rect x="392" y="156" width="26" height="32" rx="2" fill="#2563eb"/>
  <rect x="420" y="156" width="26" height="32" rx="2" fill="#10b981"/>
  <rect x="448" y="156" width="26" height="32" rx="2" fill="#eab308"/>
  <rect x="476" y="156" width="26" height="32" rx="2" fill="#f59e0b"/>
  <rect x="504" y="156" width="26" height="32" rx="2" fill="#dc2626"/>
  <text x="392" y="202" class="muted tiny">baixo</text>
  <text x="510" y="202" class="muted tiny">alto</text>
  <text x="392" y="216" class="bad tiny">qual dos cinco é o maior?</text>
  <rect x="552" y="130" width="152" height="94" rx="4" class="plot"/>
  <text x="558" y="145" class="ok badge">✓</text>
  <rect x="560" y="156" width="26" height="32" rx="2" fill="#dbeafe"/>
  <rect x="588" y="156" width="26" height="32" rx="2" fill="#93c5fd"/>
  <rect x="616" y="156" width="26" height="32" rx="2" fill="#60a5fa"/>
  <rect x="644" y="156" width="26" height="32" rx="2" fill="#2563eb"/>
  <rect x="672" y="156" width="26" height="32" rx="2" fill="#1e3a8a"/>
  <text x="560" y="202" class="muted tiny">baixo</text>
  <text x="678" y="202" class="muted tiny">alto</text>
  <text x="560" y="216" class="ok tiny">a ordem se lê sozinha</text>

  <rect x="0" y="250" width="352" height="176" rx="8" class="card"/>
  <text x="16" y="274" class="ink h">Cor atribuída pela posição</text>
  <text x="16" y="292" class="muted why">Ao filtrar uma série, as que sobram trocam de cor — e</text>
  <text x="16" y="307" class="muted why">quem aprendeu “a Acme é azul” é enganado.</text>
  <rect x="16" y="318" width="152" height="94" rx="4" class="plot"/>
  <text x="22" y="333" class="bad badge">✕</text>
  <text x="42" y="334" class="muted tiny">antes</text>
  <rect x="42" y="340" width="20" height="14" rx="2" fill="#2563eb"/>
  <text x="47" y="351" class="tiny" fill="#ffffff">A</text>
  <rect x="66" y="340" width="20" height="14" rx="2" fill="#0d9488"/>
  <text x="71" y="351" class="tiny" fill="#ffffff">B</text>
  <rect x="90" y="340" width="20" height="14" rx="2" fill="#f59e0b"/>
  <text x="95" y="351" class="tiny" fill="#ffffff">C</text>
  <text x="42" y="376" class="muted tiny">depois de tirar B</text>
  <rect x="42" y="382" width="20" height="14" rx="2" fill="#2563eb"/>
  <text x="47" y="393" class="tiny" fill="#ffffff">A</text>
  <rect x="66" y="382" width="20" height="14" rx="2" fill="#0d9488"/>
  <text x="71" y="393" class="tiny" fill="#ffffff">C</text>
  <text x="92" y="393" class="bad tiny">C mudou de cor</text>
  <rect x="184" y="318" width="152" height="94" rx="4" class="plot"/>
  <text x="190" y="333" class="ok badge">✓</text>
  <text x="210" y="334" class="muted tiny">antes</text>
  <rect x="210" y="340" width="20" height="14" rx="2" fill="#2563eb"/>
  <text x="215" y="351" class="tiny" fill="#ffffff">A</text>
  <rect x="234" y="340" width="20" height="14" rx="2" fill="#0d9488"/>
  <text x="239" y="351" class="tiny" fill="#ffffff">B</text>
  <rect x="258" y="340" width="20" height="14" rx="2" fill="#f59e0b"/>
  <text x="263" y="351" class="tiny" fill="#ffffff">C</text>
  <text x="210" y="376" class="muted tiny">depois de tirar B</text>
  <rect x="210" y="382" width="20" height="14" rx="2" fill="#2563eb"/>
  <text x="215" y="393" class="tiny" fill="#ffffff">A</text>
  <rect x="234" y="382" width="20" height="14" rx="2" fill="#f59e0b"/>
  <text x="239" y="393" class="tiny" fill="#ffffff">C</text>
  <text x="260" y="393" class="ok tiny">C continua âmbar</text>

  <rect x="368" y="250" width="352" height="176" rx="8" class="card"/>
  <text x="384" y="274" class="ink h">Três dimensões e perspectiva</text>
  <text x="384" y="292" class="muted why">A profundidade distorce comprimento e área — as duas</text>
  <text x="384" y="307" class="muted why">coisas que o gráfico existe para comparar.</text>
  <rect x="384" y="318" width="152" height="94" rx="4" class="plot"/>
  <text x="390" y="333" class="bad badge">✕</text>
  <line x1="404" y1="400" x2="524" y2="400" class="axis"/>
  <polygon points="410,362 428,354 440,360 422,368" fill="#93c5fd"/>
  <rect x="410" y="362" width="12" height="38" fill="#2563eb"/>
  <polygon points="422,368 440,360 440,394 422,400" fill="#1d4ed8" opacity="0.75"/>
  <polygon points="448,374 466,366 478,372 460,380" fill="#93c5fd"/>
  <rect x="448" y="374" width="12" height="26" fill="#2563eb"/>
  <polygon points="460,380 478,372 478,394 460,400" fill="#1d4ed8" opacity="0.75"/>
  <polygon points="486,350 504,342 516,348 498,356" fill="#93c5fd"/>
  <rect x="486" y="350" width="12" height="50" fill="#2563eb"/>
  <polygon points="498,356 516,348 516,394 498,400" fill="#1d4ed8" opacity="0.75"/>
  <rect x="552" y="318" width="152" height="94" rx="4" class="plot"/>
  <text x="558" y="333" class="ok badge">✓</text>
  <line x1="572" y1="400" x2="692" y2="400" class="axis"/>
  <rect x="582" y="360" width="24" height="40" rx="2" class="mark"/>
  <rect x="618" y="372" width="24" height="28" rx="2" class="mark"/>
  <rect x="654" y="348" width="24" height="52" rx="2" class="mark"/>

  <rect x="0" y="438" width="352" height="176" rx="8" class="card"/>
  <text x="16" y="462" class="ink h">Um número em cada ponto</text>
  <text x="16" y="480" class="muted why">Vira ruído e ninguém lê. Rotular tudo é o mesmo que</text>
  <text x="16" y="495" class="muted why">não rotular nada.</text>
  <rect x="16" y="506" width="152" height="94" rx="4" class="plot"/>
  <text x="22" y="521" class="bad badge">✕</text>
  <line x1="30" y1="590" x2="160" y2="590" class="axis"/>
  <path d="M36 574 L58 564 L80 570 L102 552 L124 556 L146 542" class="ln1"/>
  <text x="30" y="568" class="muted tiny">18</text>
  <text x="52" y="558" class="muted tiny">24</text>
  <text x="74" y="564" class="muted tiny">21</text>
  <text x="96" y="546" class="muted tiny">31</text>
  <text x="118" y="550" class="muted tiny">29</text>
  <text x="140" y="536" class="muted tiny">37</text>
  <rect x="184" y="506" width="152" height="94" rx="4" class="plot"/>
  <text x="190" y="521" class="ok badge">✓</text>
  <line x1="198" y1="590" x2="328" y2="590" class="axis"/>
  <path d="M204 574 L226 564 L248 570 L270 552 L292 556 L314 542" class="ln1"/>
  <circle cx="314" cy="542" r="3.5" class="mark"/>
  <text x="300" y="534" class="ink tiny">37</text>
  <text x="198" y="568" class="muted tiny">18</text>

  <rect x="368" y="438" width="352" height="176" rx="8" class="card"/>
  <text x="384" y="462" class="ink h">O valor só existe no hover</text>
  <text x="384" y="480" class="muted why">Exclui teclado, toque e leitor de tela de uma vez só.</text>
  <text x="384" y="495" class="muted why">Tooltip acrescenta; não pode ser o único caminho.</text>
  <rect x="384" y="506" width="152" height="94" rx="4" class="plot"/>
  <text x="390" y="521" class="bad badge">✕</text>
  <line x1="398" y1="590" x2="528" y2="590" class="axis"/>
  <rect x="406" y="558" width="18" height="32" rx="2" class="mark"/>
  <rect x="432" y="546" width="18" height="44" rx="2" class="mark"/>
  <rect x="458" y="564" width="18" height="26" rx="2" class="mark"/>
  <rect x="484" y="538" width="18" height="52" rx="2" class="mark"/>
  <rect x="452" y="516" width="44" height="17" rx="3" fill="#1f2937"/>
  <text x="464" y="529" class="tiny" fill="#ffffff">44</text>
  <path d="M443 542 l0 10 l7 -4 z" fill="#1f2937"/>
  <rect x="552" y="506" width="152" height="94" rx="4" class="plot"/>
  <text x="558" y="521" class="ok badge">✓</text>
  <line x1="566" y1="590" x2="696" y2="590" class="axis"/>
  <rect x="574" y="558" width="18" height="32" rx="2" class="mark"/>
  <text x="577" y="552" class="ink tiny">32</text>
  <rect x="600" y="546" width="18" height="44" rx="2" class="mark"/>
  <text x="603" y="540" class="ink tiny">44</text>
  <rect x="626" y="564" width="18" height="26" rx="2" class="mark"/>
  <text x="629" y="558" class="ink tiny">26</text>
  <rect x="652" y="538" width="18" height="52" rx="2" class="mark"/>
  <text x="655" y="532" class="ink tiny">52</text>

  <text x="0" y="640" class="muted cap">O erro do meio é o mais difícil de enxergar depois de pronto: ele só aparece quando alguém usa um filtro.</text>
</svg>
