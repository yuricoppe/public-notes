<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Comparação de dois pares de cores em visão normal e simulados para deuteranopia: vermelho e verde, que têm diferença 32,5 na visão normal, caem para 3,0 sob deuteranopia e ficam praticamente idênticos; azul e laranja mantêm diferença 28,5 e continuam distinguíveis">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .sw    { stroke: #ffffff; stroke-width: 2; }
    .bad   { fill: #dc2626; }
    .ok    { fill: #10b981; }
    .accent{ fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .n   { font-size: 20px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .sw { stroke: #111827; }
      .bad { fill: #f87171; } .ok { fill: #34d399; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Por que não dá para conferir cor no olho</text>
  <text x="0" y="44" class="muted cap">Os mesmos dois pares, à esquerda como a maioria vê, à direita simulados para deuteranopia</text>

  <text x="150" y="76" class="muted k">VISÃO NORMAL</text>
  <text x="430" y="76" class="muted k">DEUTERANOPIA SIMULADA</text>

  <rect x="0" y="88" width="720" height="132" rx="8" class="box"/>
  <text x="18" y="114" class="bad k">✕ REPROVA</text>
  <text x="18" y="140" class="ink h">Vermelho e verde</text>
  <text x="18" y="164" class="muted cap">O par mais usado</text>
  <text x="18" y="182" class="muted cap">para “bom e ruim”.</text>

  <rect x="150" y="108" width="112" height="42" rx="5" fill="#e03131" class="sw"/>
  <text x="158" y="134" class="mono" fill="#ffffff">#e03131</text>
  <rect x="150" y="156" width="112" height="42" rx="5" fill="#2f9e44" class="sw"/>
  <text x="158" y="182" class="mono" fill="#ffffff">#2f9e44</text>
  <text x="278" y="158" class="ink n">ΔE 32,5</text>

  <rect x="430" y="108" width="112" height="42" rx="5" fill="#938429" class="sw"/>
  <text x="438" y="134" class="mono" fill="#ffffff">#938429</text>
  <rect x="430" y="156" width="112" height="42" rx="5" fill="#93874b" class="sw"/>
  <text x="438" y="182" class="mono" fill="#ffffff">#93874b</text>
  <text x="558" y="152" class="bad n">ΔE 3,0</text>
  <text x="558" y="174" class="muted cap">a mesma cor,</text>
  <text x="558" y="192" class="muted cap">na prática</text>

  <rect x="0" y="232" width="720" height="132" rx="8" class="box"/>
  <text x="18" y="258" class="ok k">✓ APROVA</text>
  <text x="18" y="284" class="ink h">Azul e laranja</text>
  <text x="18" y="308" class="muted cap">Diferem em matiz</text>
  <text x="18" y="326" class="muted cap">e em luminosidade.</text>

  <rect x="150" y="252" width="112" height="42" rx="5" fill="#1971c2" class="sw"/>
  <text x="158" y="278" class="mono" fill="#ffffff">#1971c2</text>
  <rect x="150" y="300" width="112" height="42" rx="5" fill="#f08c00" class="sw"/>
  <text x="158" y="326" class="mono" fill="#ffffff">#f08c00</text>
  <text x="278" y="302" class="ink n">ΔE 36,7</text>

  <rect x="430" y="252" width="112" height="42" rx="5" fill="#2a68c0" class="sw"/>
  <text x="438" y="278" class="mono" fill="#ffffff">#2a68c0</text>
  <rect x="430" y="300" width="112" height="42" rx="5" fill="#c3ad03" class="sw"/>
  <text x="438" y="326" class="mono" fill="#ffffff">#c3ad03</text>
  <text x="558" y="302" class="ok n">ΔE 28,5</text>

  <text x="0" y="396" class="muted cap">ΔE é a distância entre duas cores em espaço perceptual. Acima de 8 elas se separam; 3,0 é ruído. Os números</text>
  <text x="0" y="414" class="muted cap">acima foram calculados, não estimados — e é essa a única forma de saber. Simulação Machado et al., 2009.</text>
</svg>
