<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="Fluxo de governança: o time de produto começa pelo que já existe no sistema; quando nada serve, decide-se se aquilo é um floco de neve que fica no produto ou um padrão do sistema, que então passa por protótipo, revisão, testes, documentação, publicação e adoção">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.3; }
    .q     { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.5; }
    .off   { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .accent{ fill: #2563eb; }
    .line  { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11.5px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .q { fill: #1e293b; stroke: #60a5fa; }
      .off { fill: #1f2937; stroke: #6b7280; }
      .accent { fill: #60a5fa; }
      .line { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O caminho de um padrão novo</text>
  <text x="0" y="44" class="muted cap">O valor deste fluxo não é a burocracia: é existir uma resposta conhecida para “e agora?”.</text>

  <rect x="0" y="66" width="216" height="52" rx="8" class="box"/>
  <text x="16" y="90" class="ink h">1 · Usar o que já existe</text>
  <text x="16" y="108" class="muted cap">o padrão é o sistema, não o novo</text>

  <path d="M216 92 H 250" class="line" marker-end="url(#g)"/>

  <rect x="250" y="66" width="216" height="52" rx="8" class="box"/>
  <text x="266" y="90" class="ink h">2 · Nada serve</text>
  <text x="266" y="108" class="muted cap">o time procura o time do sistema</text>

  <path d="M466 92 H 500" class="line" marker-end="url(#g)"/>

  <rect x="500" y="66" width="220" height="52" rx="8" class="q"/>
  <text x="516" y="90" class="accent h">3 · Quantos produtos?</text>
  <text x="516" y="108" class="muted cap">a única pergunta que decide</text>

  <path d="M610 118 V 146" class="line" marker-end="url(#g)"/>
  <path d="M500 92 H 470 V 146 H 380" class="line" marker-end="url(#g)"/>
  <text x="392" y="138" class="muted cap">só um</text>

  <rect x="160" y="146" width="216" height="52" rx="8" class="off"/>
  <text x="176" y="170" class="ink h">Fica no produto</text>
  <text x="176" y="188" class="muted cap">floco de neve ou receita — tudo bem</text>

  <rect x="500" y="146" width="220" height="52" rx="8" class="box"/>
  <text x="516" y="170" class="ink h">4 · Protótipo</text>
  <text x="516" y="188" class="muted cap">o mais barato possível</text>

  <path d="M610 198 V 226" class="line" marker-end="url(#g)"/>
  <rect x="500" y="226" width="220" height="52" rx="8" class="box"/>
  <text x="516" y="250" class="ink h">5 · Revisão conjunta</text>
  <text x="516" y="268" class="muted cap">produto e sistema, juntos</text>

  <path d="M500 252 H 380" class="line" marker-end="url(#g)"/>
  <rect x="160" y="226" width="216" height="52" rx="8" class="box"/>
  <text x="176" y="250" class="ink h">6 · Construir e testar</text>
  <text x="176" y="268" class="muted cap">a11y, navegadores, responsivo, estresse</text>

  <path d="M268 278 V 306" class="line" marker-end="url(#g)"/>
  <rect x="160" y="306" width="216" height="52" rx="8" class="box"/>
  <text x="176" y="330" class="ink h">7 · Documentar e publicar</text>
  <text x="176" y="348" class="muted cap">com versão e registro de mudança</text>

  <path d="M376 332 H 500" class="line" marker-end="url(#g)"/>
  <rect x="500" y="306" width="220" height="52" rx="8" class="box"/>
  <text x="516" y="330" class="ink h">8 · Adotar e verificar</text>
  <text x="516" y="348" class="muted cap">o produto atualiza e confere</text>

  <text x="0" y="396" class="muted cap">Duas coisas quebram este fluxo na prática: revisão lenta, que ensina os times a não pedir; e a recusa de</text>
  <text x="0" y="414" class="muted cap">deixar o floco existir, que empurra para o sistema coisa que só serve a uma tela.</text>

  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
