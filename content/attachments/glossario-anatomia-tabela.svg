<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Tabela de dados anotada em seis pontos: seleção em lote, ordenação com aria-sort, números alinhados à direita, coluna de ações, zebra ou divisória e paginação com total">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .badge { fill: #2563eb; }
    .accent{ fill: #2563eb; }
    .div   { stroke: #f3f4f6; stroke-width: 1; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .num { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Anatomia de uma tabela de dados</text>
  <text x="0" y="44" class="muted cap">Tabela existe para comparar linha com linha. Cada decisão abaixo ou ajuda essa comparação, ou atrapalha</text>

  <rect x="0" y="86" width="720" height="224" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>

  <!-- toolbar -->
  <rect x="30" y="94" width="180" height="24" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="44" cy="105" r="4.5" fill="none" stroke="#9ca3af" stroke-width="1.3"/>
  <line x1="47" y1="108" x2="50" y2="111" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="58" y="110" font-size="11" fill="#9ca3af">Buscar pedido</text>
  <rect x="224" y="94" width="116" height="24" rx="12" fill="#dbeafe"/>
  <text x="234" y="110" font-size="11" fill="#1e40af">Status: Pago</text>
  <text x="320" y="110" font-size="10" fill="#1e40af">✕</text>

  <!-- header -->
  <rect x="0" y="122" width="720" height="30" fill="#f3f4f6"/>
  <rect x="30" y="130" width="14" height="14" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="66" y="142" font-size="10" font-weight="700" fill="#6b7280">PEDIDO</text>
  <path d="M 118 140 L 122 134 L 126 140 Z" fill="#2563eb"/>
  <text x="160" y="142" font-size="10" font-weight="700" fill="#6b7280">CLIENTE</text>
  <text x="340" y="142" font-size="10" font-weight="700" fill="#6b7280">STATUS</text>
  <text x="520" y="142" font-size="10" font-weight="700" fill="#6b7280">VALOR</text>
  <text x="612" y="142" font-size="10" font-weight="700" fill="#6b7280">AÇÕES</text>

  <!-- rows -->
  <rect x="0" y="182" width="720" height="30" fill="#f9fafb"/>
  <rect x="0" y="242" width="720" height="30" fill="#f9fafb"/>
  <line x1="0" y1="182" x2="720" y2="182" class="div"/>
  <line x1="0" y1="212" x2="720" y2="212" class="div"/>
  <line x1="0" y1="242" x2="720" y2="242" class="div"/>
  <line x1="0" y1="272" x2="720" y2="272" class="div"/>

  <rect x="30" y="160" width="14" height="14" rx="3" fill="#2563eb"/>
  <path d="M 33.5 167 L 36 169.5 L 41 164" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="66" y="171" font-size="12" fill="#1f2937">12342-22</text>
  <text x="160" y="171" font-size="12" fill="#1f2937">Marina Alves</text>
  <rect x="340" y="161" width="46" height="18" rx="9" fill="#dcfce7"/>
  <text x="352" y="174" font-size="10" fill="#166534">Pago</text>
  <text x="560" y="171" font-size="12" fill="#1f2937" text-anchor="end">R$ 1.240,00</text>
  <text x="616" y="172" font-size="15" fill="#6b7280">⋯</text>

  <rect x="30" y="190" width="14" height="14" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="66" y="201" font-size="12" fill="#1f2937">12343-01</text>
  <text x="160" y="201" font-size="12" fill="#1f2937">Carlos Nunes</text>
  <rect x="340" y="191" width="64" height="18" rx="9" fill="#fef3c7"/>
  <text x="352" y="204" font-size="10" fill="#92400e">Pendente</text>
  <text x="560" y="201" font-size="12" fill="#1f2937" text-anchor="end">R$ 89,90</text>
  <text x="616" y="202" font-size="15" fill="#6b7280">⋯</text>

  <rect x="30" y="220" width="14" height="14" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="66" y="231" font-size="12" fill="#1f2937">12344-77</text>
  <text x="160" y="231" font-size="12" fill="#1f2937">Ana Beatriz Ramos</text>
  <rect x="340" y="221" width="46" height="18" rx="9" fill="#dcfce7"/>
  <text x="352" y="234" font-size="10" fill="#166534">Pago</text>
  <text x="560" y="231" font-size="12" fill="#1f2937" text-anchor="end">R$ 3.115,50</text>
  <text x="616" y="232" font-size="15" fill="#6b7280">⋯</text>

  <rect x="30" y="250" width="14" height="14" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="66" y="261" font-size="12" fill="#1f2937">12345-09</text>
  <text x="160" y="261" font-size="12" fill="#1f2937">Rafael Lima</text>
  <rect x="340" y="251" width="70" height="18" rx="9" fill="#fee2e2"/>
  <text x="352" y="264" font-size="10" fill="#991b1b">Cancelado</text>
  <text x="560" y="261" font-size="12" fill="#1f2937" text-anchor="end">R$ 240,00</text>
  <text x="616" y="262" font-size="15" fill="#6b7280">⋯</text>

  <!-- pagination -->
  <text x="30" y="293" font-size="11" fill="#6b7280">1–4 de 128 pedidos</text>
  <rect x="560" y="280" width="24" height="22" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="569" y="295" font-size="11" fill="#6b7280">‹</text>
  <rect x="590" y="280" width="24" height="22" rx="4" fill="#2563eb"/>
  <text x="599" y="295" font-size="11" fill="#ffffff">1</text>
  <rect x="620" y="280" width="24" height="22" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="629" y="295" font-size="11" fill="#1f2937">2</text>
  <rect x="650" y="280" width="24" height="22" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="659" y="295" font-size="11" fill="#1f2937">3</text>
  <rect x="680" y="280" width="24" height="22" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="689" y="295" font-size="11" fill="#6b7280">›</text>

  <!-- badges -->
  <circle cx="14" cy="137" r="8" class="badge"/><text x="11" y="140.5" class="num">1</text>
  <circle cx="140" cy="137" r="8" class="badge"/><text x="137" y="140.5" class="num">2</text>
  <circle cx="578" cy="137" r="8" class="badge"/><text x="575" y="140.5" class="num">3</text>
  <circle cx="694" cy="160" r="8" class="badge"/><text x="691" y="163.5" class="num">4</text>
  <circle cx="14" cy="197" r="8" class="badge"/><text x="11" y="200.5" class="num">5</text>
  <circle cx="14" cy="291" r="8" class="badge"/><text x="11" y="294.5" class="num">6</text>

  <!-- annotations -->
  <circle cx="10" cy="342" r="9" class="badge"/><text x="6.5" y="345.5" class="num">1</text>
  <text x="28" y="346" class="ink h">Seleção em lote</text>
  <text x="0" y="368" class="muted an">O checkbox do topo marca a página,</text>
  <text x="0" y="384" class="muted an">não a base inteira. Diga qual é.</text>

  <circle cx="254" cy="342" r="9" class="badge"/><text x="250.5" y="345.5" class="num">2</text>
  <text x="272" y="346" class="ink h">Ordenação</text>
  <text x="244" y="368" class="muted an">Ícone visível no cabeçalho e aria-sort</text>
  <text x="244" y="384" class="muted an">no &lt;th&gt;, para o leitor de tela saber.</text>

  <circle cx="498" cy="342" r="9" class="badge"/><text x="494.5" y="345.5" class="num">3</text>
  <text x="516" y="346" class="ink h">Números à direita</text>
  <text x="488" y="368" class="muted an">Alinhados pela unidade, casas fixas.</text>
  <text x="488" y="384" class="muted an">É o que deixa comparar de relance.</text>

  <circle cx="10" cy="412" r="9" class="badge"/><text x="6.5" y="415.5" class="num">4</text>
  <text x="28" y="416" class="ink h">Ações por linha</text>
  <text x="0" y="438" class="muted an">Coluna fixa à direita. Menu ⋯ quando</text>
  <text x="0" y="454" class="muted an">passam de duas ações.</text>

  <circle cx="254" cy="412" r="9" class="badge"/><text x="250.5" y="415.5" class="num">5</text>
  <text x="272" y="416" class="ink h">Zebra ou divisória</text>
  <text x="244" y="438" class="muted an">Uma coisa ou outra, nunca as duas.</text>
  <text x="244" y="454" class="muted an">Altura de linha sempre constante.</text>

  <circle cx="498" cy="412" r="9" class="badge"/><text x="494.5" y="415.5" class="num">6</text>
  <text x="516" y="416" class="ink h">Paginação</text>
  <text x="488" y="438" class="muted an">Mostre o total. "1–4 de 128" diz mais</text>
  <text x="488" y="454" class="muted an">do que duas setas soltas.</text>
</svg>
