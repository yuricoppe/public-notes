<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Seletor de data anotado: navegação entre meses, dia de hoje contornado, dia selecionado preenchido, intervalo destacado e dias desabilitados, mais o mapa de teclado">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Seletor de data</text>
  <text x="0" y="44" class="muted cap">O calendário é uma tabela de verdade — e é isso que decide se ele funciona no teclado e no leitor de tela</text>

  <rect x="0" y="70" width="300" height="248" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="16" y="94" font-size="10" fill="#6b7280">Data de entrega</text>
  <rect x="16" y="100" width="268" height="28" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="26" y="119" font-size="11" fill="#1f2937">12/08/2026 &#8211; 16/08/2026</text>

  <path d="M 34 148 L 28 143 L 34 138" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  <text x="150" y="147" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">Agosto 2026</text>
  <path d="M 266 138 L 272 143 L 266 148" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>

  <text x="30"  y="170" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">D</text>
  <text x="68"  y="170" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">S</text>
  <text x="106" y="170" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">T</text>
  <text x="144" y="170" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">Q</text>
  <text x="182" y="170" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">Q</text>
  <text x="220" y="170" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">S</text>
  <text x="258" y="170" font-size="9" font-weight="700" fill="#6b7280" text-anchor="middle">S</text>

  <text x="144" y="192" font-size="10" fill="#d1d5db" text-anchor="middle">1</text>
  <text x="182" y="192" font-size="10" fill="#d1d5db" text-anchor="middle">2</text>
  <text x="220" y="192" font-size="10" fill="#d1d5db" text-anchor="middle">3</text>
  <text x="258" y="192" font-size="10" fill="#d1d5db" text-anchor="middle">4</text>
  <text x="30"  y="216" font-size="10" fill="#d1d5db" text-anchor="middle">5</text>
  <text x="68"  y="216" font-size="10" fill="#d1d5db" text-anchor="middle">6</text>
  <text x="106" y="216" font-size="10" fill="#d1d5db" text-anchor="middle">7</text>
  <text x="144" y="216" font-size="10" fill="#d1d5db" text-anchor="middle">8</text>
  <text x="182" y="216" font-size="10" fill="#d1d5db" text-anchor="middle">9</text>
  <circle cx="220" cy="212" r="13" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="216" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">10</text>
  <text x="258" y="216" font-size="10" fill="#1f2937" text-anchor="middle">11</text>

  <rect x="17" y="228" width="241" height="26" fill="#dbeafe"/>
  <circle cx="30" cy="241" r="13" fill="#2563eb"/>
  <text x="30"  y="245" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">12</text>
  <text x="68"  y="245" font-size="10" fill="#1e40af" text-anchor="middle">13</text>
  <text x="106" y="245" font-size="10" fill="#1e40af" text-anchor="middle">14</text>
  <text x="144" y="245" font-size="10" fill="#1e40af" text-anchor="middle">15</text>
  <circle cx="182" cy="241" r="13" fill="#2563eb"/>
  <text x="182" y="245" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">16</text>
  <text x="220" y="245" font-size="10" fill="#1f2937" text-anchor="middle">17</text>
  <text x="258" y="245" font-size="10" fill="#1f2937" text-anchor="middle">18</text>

  <text x="30"  y="274" font-size="10" fill="#1f2937" text-anchor="middle">19</text>
  <text x="68"  y="274" font-size="10" fill="#1f2937" text-anchor="middle">20</text>
  <text x="106" y="274" font-size="10" fill="#1f2937" text-anchor="middle">21</text>
  <text x="144" y="274" font-size="10" fill="#1f2937" text-anchor="middle">22</text>
  <text x="182" y="274" font-size="10" fill="#1f2937" text-anchor="middle">23</text>
  <text x="220" y="274" font-size="10" fill="#1f2937" text-anchor="middle">24</text>
  <text x="258" y="274" font-size="10" fill="#1f2937" text-anchor="middle">25</text>

  <rect x="16" y="288" width="70" height="20" rx="10" fill="#f3f4f6"/>
  <text x="51" y="302" font-size="9" fill="#1f2937" text-anchor="middle">Hoje</text>
  <rect x="94" y="288" width="86" height="20" rx="10" fill="#f3f4f6"/>
  <text x="137" y="302" font-size="9" fill="#1f2937" text-anchor="middle">Próximos 7</text>
  <text x="284" y="302" font-size="9" fill="#2563eb" text-anchor="end">Limpar</text>

  <text x="330" y="94" class="ink h">Campo de texto junto, sempre</text>
  <text x="330" y="114" class="muted an">Quem sabe a data digita mais rápido do que navega.</text>
  <text x="330" y="130" class="muted an">O calendário complementa o campo, não o substitui.</text>

  <text x="330" y="164" class="ink h">Quatro estados por dia</text>
  <text x="330" y="184" class="muted an">Contornado é hoje. Preenchido é o selecionado. Faixa</text>
  <text x="330" y="200" class="muted an">azul é o intervalo. Cinza claro é indisponível — e</text>
  <text x="330" y="216" class="muted an">precisa de aria-disabled, não só de cor fraca.</text>

  <text x="330" y="250" class="ink h">Atalhos poupam navegação</text>
  <text x="330" y="270" class="muted an">"Hoje" e "Próximos 7 dias" resolvem a maior parte dos</text>
  <text x="330" y="286" class="muted an">casos sem ninguém precisar caçar no grid.</text>

  <rect x="0" y="332" width="720" height="56" rx="6" class="card"/>
  <text x="16" y="352" class="ink h">Teclado</text>
  <text x="72" y="352" class="muted an">setas movem dia a dia &#183; PageUp/PageDown trocam de mês &#183; Home/End vão ao começo</text>
  <text x="72" y="372" class="muted an">e ao fim da semana &#183; Enter seleciona &#183; Esc fecha e devolve o foco ao campo</text></svg>
