<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Três estruturas de página: largura total, barra lateral à direita e barra lateral à esquerda, todas com cabeçalho e rodapé; no mobile as três convergem para uma única coluna empilhada">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .chrome{ fill: #e5e7eb; stroke: #d1d5db; stroke-width: 1; }
    .main  { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; }
    .side  { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.5; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .chrome { fill: #374151; stroke: #4b5563; }
      .main { fill: #1e3a5f; stroke: #3b82f6; }
      .side { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">As três estruturas de página que cobrem quase tudo</text>
  <text x="0" y="44" class="muted cap">Cabeçalho e rodapé são constantes; o que varia é se existe barra lateral e de que lado ela fica</text>

  <!-- 1: full width -->
  <text x="0" y="78" class="ink h">Largura total</text>
  <rect x="0" y="88" width="224" height="192" rx="4" class="frame"/>
  <rect x="8" y="96" width="208" height="26" rx="3" class="chrome"/>
  <text x="16" y="113" class="muted an">Cabeçalho</text>
  <rect x="8" y="130" width="208" height="112" rx="3" class="main"/>
  <text x="16" y="149" class="ink an">Conteúdo principal</text>
  <text x="16" y="167" class="muted an">12 de 12 colunas</text>
  <rect x="8" y="250" width="208" height="22" rx="3" class="chrome"/>
  <text x="16" y="265" class="muted an">Rodapé</text>
  <text x="0" y="298" class="muted an">Artigo, landing, checkout — tudo que</text>
  <text x="0" y="314" class="muted an">pede foco em uma coisa só.</text>

  <!-- 2: sidebar right -->
  <text x="248" y="78" class="ink h">Barra lateral à direita</text>
  <rect x="248" y="88" width="224" height="192" rx="4" class="frame"/>
  <rect x="256" y="96" width="208" height="26" rx="3" class="chrome"/>
  <text x="264" y="113" class="muted an">Cabeçalho</text>
  <rect x="256" y="130" width="136" height="112" rx="3" class="main"/>
  <text x="264" y="149" class="ink an">Conteúdo</text>
  <text x="264" y="167" class="muted an">8 colunas</text>
  <rect x="400" y="130" width="64" height="112" rx="3" class="side"/>
  <text x="408" y="149" class="ink an">Lateral</text>
  <text x="408" y="167" class="muted an">4 colunas</text>
  <rect x="256" y="250" width="208" height="22" rx="3" class="chrome"/>
  <text x="264" y="265" class="muted an">Rodapé</text>
  <text x="248" y="298" class="muted an">Conteúdo em primeiro na leitura;</text>
  <text x="248" y="314" class="muted an">lateral para o que é secundário.</text>

  <!-- 3: sidebar left -->
  <text x="496" y="78" class="ink h">Barra lateral à esquerda</text>
  <rect x="496" y="88" width="224" height="192" rx="4" class="frame"/>
  <rect x="504" y="96" width="208" height="26" rx="3" class="chrome"/>
  <text x="512" y="113" class="muted an">Cabeçalho</text>
  <rect x="504" y="130" width="64" height="112" rx="3" class="side"/>
  <text x="512" y="149" class="ink an">Lateral</text>
  <text x="512" y="167" class="muted an">navegação</text>
  <text x="512" y="183" class="muted an">ou filtros</text>
  <rect x="576" y="130" width="136" height="112" rx="3" class="main"/>
  <text x="584" y="149" class="ink an">Conteúdo</text>
  <rect x="504" y="250" width="208" height="22" rx="3" class="chrome"/>
  <text x="512" y="265" class="muted an">Rodapé</text>
  <text x="496" y="298" class="muted an">Quando a lateral é ferramenta de</text>
  <text x="496" y="314" class="muted an">trabalho, não apêndice.</text>

  <!-- mobile note -->
  <rect x="0" y="336" width="52" height="56" rx="4" class="frame"/>
  <rect x="6" y="342" width="40" height="10" rx="2" class="chrome"/>
  <rect x="6" y="356" width="40" height="20" rx="2" class="main"/>
  <rect x="6" y="380" width="40" height="8" rx="2" class="side"/>
  <text x="68" y="356" class="accent h">No mobile, as três viram a mesma coisa</text>
  <text x="68" y="376" class="muted cap">Uma coluna só. A pergunta que sobra é o que vem antes — e a lateral quase nunca é a resposta.</text>
</svg>
