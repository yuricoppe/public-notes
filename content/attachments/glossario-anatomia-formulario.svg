<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" role="img" aria-label="Formulário anotado em cinco pontos: rótulo acima do campo, texto de ajuda antes do erro, largura do campo sugerindo o tamanho da resposta, mensagem de erro colada ao campo e hierarquia clara nos botões">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .sheet { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.2; }
    .badge { fill: #2563eb; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 12px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Anatomia de um formulário que não briga com quem preenche</text>
  <text x="0" y="44" class="muted cap">Formulário é uma fila de perguntas. Tudo aqui serve para a pessoa nunca precisar voltar e refazer</text>

  <rect x="0" y="70" width="300" height="336" rx="6" class="sheet"/>

  <text x="18" y="98" font-size="13" font-weight="700" fill="#1f2937">Endereço de entrega</text>

  <text x="18" y="126" font-size="11" fill="#6b7280">CEP <tspan fill="#dc2626">*</tspan></text>
  <rect x="18" y="132" width="140" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="28" y="153" font-size="12" fill="#1f2937">01310-100</text>
  <text x="18" y="182" font-size="11" fill="#6b7280">Só números, sem traço</text>

  <text x="18" y="210" font-size="11" fill="#6b7280">Rua <tspan fill="#dc2626">*</tspan></text>
  <rect x="18" y="216" width="264" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="28" y="237" font-size="12" fill="#1f2937">Av. Paulista</text>

  <text x="18" y="276" font-size="11" fill="#6b7280">Número <tspan fill="#dc2626">*</tspan></text>
  <rect x="18" y="282" width="90" height="32" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="18" y="332" font-size="11" fill="#dc2626">Informe o número. Se não houver, escreva "s/n".</text>

  <rect x="18" y="356" width="120" height="34" rx="6" fill="#2563eb"/>
  <text x="46" y="378" font-size="12" font-weight="600" fill="#ffffff">Continuar</text>
  <text x="158" y="378" font-size="12" font-weight="600" fill="#2563eb">Voltar</text>

  <!-- badges on form -->
  <circle cx="318" cy="122" r="10" class="badge"/><text x="314.5" y="126" class="num">1</text>
  <circle cx="318" cy="178" r="10" class="badge"/><text x="314.5" y="182" class="num">2</text>
  <circle cx="318" cy="298" r="10" class="badge"/><text x="314.5" y="302" class="num">3</text>
  <circle cx="318" cy="328" r="10" class="badge"/><text x="314.5" y="332" class="num">4</text>
  <circle cx="318" cy="373" r="10" class="badge"/><text x="314.5" y="377" class="num">5</text>

  <!-- annotations -->
  <circle cx="362" cy="106" r="10" class="badge"/><text x="358.5" y="110" class="num">1</text>
  <text x="382" y="110" class="ink h">Rótulo acima do campo</text>
  <text x="382" y="130" class="muted an">Fica visível o tempo todo, sobrevive ao zoom e ao</text>
  <text x="382" y="146" class="muted an">preenchimento automático. Placeholder não é rótulo.</text>

  <circle cx="362" cy="176" r="10" class="badge"/><text x="358.5" y="180" class="num">2</text>
  <text x="382" y="180" class="ink h">Ajuda antes do erro</text>
  <text x="382" y="200" class="muted an">Dizer "só números" de antemão evita a mensagem de</text>
  <text x="382" y="216" class="muted an">erro que você mostraria depois.</text>

  <circle cx="362" cy="246" r="10" class="badge"/><text x="358.5" y="250" class="num">3</text>
  <text x="382" y="250" class="ink h">Largura conta uma história</text>
  <text x="382" y="270" class="muted an">Campo de número curto, campo de rua longo. É uma</text>
  <text x="382" y="286" class="muted an">dica sobre o formato esperado, e sai de graça.</text>

  <circle cx="362" cy="316" r="10" class="badge"/><text x="358.5" y="320" class="num">4</text>
  <text x="382" y="320" class="ink h">Erro colado no campo</text>
  <text x="382" y="340" class="muted an">Específico, e dizendo como resolver. Ligado ao campo</text>
  <text x="382" y="356" class="muted an">por aria-describedby, para o leitor de tela anunciar.</text>

  <circle cx="362" cy="386" r="10" class="badge"/><text x="358.5" y="390" class="num">5</text>
  <text x="382" y="390" class="ink h">Um primário, um caminho de volta</text>
  <text x="382" y="410" class="muted an">Não desabilite o botão até tudo estar válido: deixe</text>
  <text x="382" y="426" class="muted an">enviar e mostre onde está o problema.</text>

  <text x="0" y="428" class="accent an">Uma coluna só: duas fazem o olho</text>
  <text x="0" y="444" class="accent an">pular campos sem perceber.</text>
</svg>
