<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="Fluxo do duplo pedido de permissão: primeiro um convite na própria interface, que pode ser recusado sem custo; só quem aceita vê o prompt nativo do sistema, que só pode ser mostrado uma vez; e quem bloqueia recebe uma página de recuperação explicando como reverter nas configurações">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.4; }
    .soft  { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
    .accent{ fill: #2563eb; }
    .ok    { fill: #10b981; }
    .bad   { fill: #dc2626; }
    .line  { stroke: #9ca3af; stroke-width: 1.6; fill: none; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11.5px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .soft { fill: #111827; stroke: #6b7280; }
      .accent { fill: #60a5fa; }
      .ok { fill: #34d399; }
      .bad { fill: #f87171; }
      .line { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">O duplo pedido</text>
  <text x="0" y="44" class="muted cap">O prompt nativo só pode ser mostrado uma vez. A pergunta da interface gasta essa chance com quem já disse sim.</text>

  <rect x="0" y="70" width="216" height="130" rx="8" class="box"/>
  <text x="16" y="94" class="accent k">1 · NA SUA INTERFACE</text>
  <text x="16" y="118" class="ink h">O convite</text>
  <text x="16" y="142" class="muted cap">Depois de a pessoa ter usado</text>
  <text x="16" y="160" class="muted cap">o produto e num momento em</text>
  <text x="16" y="178" class="muted cap">que a oferta faz sentido.</text>

  <path d="M216 135 H252" class="line" marker-end="url(#a)"/>

  <rect x="252" y="70" width="216" height="130" rx="8" class="box"/>
  <text x="268" y="94" class="accent k">2 · DO SISTEMA</text>
  <text x="268" y="118" class="ink h">O prompt nativo</text>
  <text x="268" y="142" class="muted cap">Só é disparado para quem</text>
  <text x="268" y="160" class="muted cap">aceitou o convite. Bloqueio</text>
  <text x="268" y="178" class="muted cap">aqui costuma ser definitivo.</text>

  <path d="M468 135 H504" class="line" marker-end="url(#a)"/>

  <rect x="504" y="70" width="216" height="130" rx="8" class="box"/>
  <text x="520" y="94" class="accent k">3 · SE FOR BLOQUEADO</text>
  <text x="520" y="118" class="ink h">A recuperação</text>
  <text x="520" y="142" class="muted cap">Uma tela que explica como</text>
  <text x="520" y="160" class="muted cap">reverter nas configurações —</text>
  <text x="520" y="178" class="muted cap">e um canal alternativo.</text>

  <rect x="0" y="224" width="352" height="150" rx="8" class="soft"/>
  <circle cx="24" cy="250" r="7" class="ok"/>
  <text x="42" y="255" class="ink h">O convite diz três coisas</text>
  <text x="24" y="282" class="muted cap">Sobre o que você vai avisar — em exemplos, não</text>
  <text x="24" y="300" class="muted cap">em categorias vagas.</text>
  <text x="24" y="322" class="muted cap">Com que frequência.</text>
  <text x="24" y="344" class="muted cap">Que dá para desligar depois, e onde.</text>

  <rect x="368" y="224" width="352" height="150" rx="8" class="soft"/>
  <circle cx="392" cy="250" r="7" class="bad"/>
  <text x="410" y="255" class="ink h">O que queima a chance</text>
  <text x="392" y="282" class="muted cap">Pedir no primeiro segundo, antes de haver valor.</text>
  <text x="392" y="304" class="muted cap">Disfarçar o convite de outra coisa (chat, cookie).</text>
  <text x="392" y="326" class="muted cap">Condicionar o conteúdo ao aceite.</text>
  <text x="392" y="348" class="muted cap">Não oferecer saída — o que empurra para o bloqueio</text>
  <text x="392" y="366" class="muted cap">no nível do sistema, de onde não se volta.</text>

  <text x="0" y="404" class="muted cap">Recusar o convite da interface não custa nada: dá para perguntar de novo mais tarde, em contexto melhor.</text>
  <text x="0" y="422" class="muted cap">Recusar o prompt nativo custa o canal inteiro.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
