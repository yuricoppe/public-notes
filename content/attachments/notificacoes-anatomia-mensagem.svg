<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Comparação entre uma mensagem de erro ruim e uma boa: a ruim diz apenas que uma requisição falhou com um código técnico, a boa nomeia o que aconteceu, o efeito para a pessoa e a próxima ação, com o botão que resolve dentro da própria mensagem">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.4; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .chip  { fill: #e5e7eb; }
    .bad   { fill: #dc2626; }
    .ok    { fill: #10b981; }
    .accent{ fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11.5px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #111827; stroke: #6b7280; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .chip { fill: #374151; }
      .bad { fill: #f87171; } .ok { fill: #34d399; } .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Três coisas que toda mensagem precisa dizer</text>
  <text x="0" y="44" class="muted cap">O que aconteceu, o que isso significa para quem está lendo, e qual é a próxima ação</text>

  <rect x="0" y="70" width="348" height="120" rx="8" class="card"/>
  <rect x="0" y="70" width="5" height="120" class="bad"/>
  <text x="20" y="96" class="bad k">✕ NÃO</text>
  <text x="20" y="124" class="ink h">Erro</text>
  <text x="20" y="150" class="muted mono">Request failed with status code 500</text>
  <text x="20" y="176" class="muted cap">Diz que falhou. Não diz o quê, nem o que fazer.</text>

  <rect x="372" y="70" width="348" height="120" rx="8" class="card"/>
  <rect x="372" y="70" width="5" height="120" class="ok"/>
  <text x="392" y="96" class="ok k">✓ SIM</text>
  <text x="392" y="124" class="ink h">Não deu para salvar o rascunho</text>
  <text x="392" y="150" class="muted cap">O texto continua aqui e nada foi perdido.</text>
  <rect x="392" y="160" width="106" height="24" rx="5" class="chip"/>
  <text x="406" y="177" class="accent cap">Tentar de novo</text>

  <rect x="0" y="212" width="348" height="146" rx="8" class="box"/>
  <text x="18" y="238" class="ink h">O que cortar</text>
  <text x="18" y="264" class="muted cap">Códigos e nomes internos, a menos que exista</text>
  <text x="18" y="282" class="muted cap">um suporte que peça por eles.</text>
  <text x="18" y="306" class="muted cap">Pedido de desculpa no lugar de solução.</text>
  <text x="18" y="330" class="muted cap">Voz passiva que esconde quem faz o quê.</text>
  <text x="18" y="352" class="muted cap">Exclamação em mensagem de erro.</text>

  <rect x="372" y="212" width="348" height="146" rx="8" class="box"/>
  <text x="390" y="238" class="ink h">O que manter</text>
  <text x="390" y="264" class="muted cap">A palavra mais importante no começo — o corte</text>
  <text x="390" y="282" class="muted cap">vem sem aviso e varia por aparelho.</text>
  <text x="390" y="306" class="muted cap">Estado do dado: o que foi salvo e o que não foi.</text>
  <text x="390" y="330" class="muted cap">Uma ação só, com verbo, dentro da mensagem.</text>
  <text x="390" y="352" class="muted cap">Tom proporcional: erro é sóbrio, não dramático.</text>

  <text x="0" y="390" class="muted cap">Teste rápido: leia só o título em voz alta. Se ainda assim a pessoa sabe se precisa fazer</text>
  <text x="0" y="410" class="muted cap">alguma coisa, a mensagem está pronta.</text>
</svg>
