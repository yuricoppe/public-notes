<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-label="Os mesmos quatro valores desenhados com o eixo começando em zero e com o eixo truncado: no primeiro a diferença parece pequena, no segundo parece enorme, e o achado da pesquisa é que marcar a quebra do eixo não corrige essa distorção">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .bar   { fill: #2563eb; }
    .grid  { stroke: #d1d5db; stroke-width: 1; }
    .warnb { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
    .warn  { fill: #b45309; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    .ax  { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .bar { fill: #60a5fa; }
      .grid { stroke: #4b5563; }
      .warnb { fill: #2a2312; stroke: #fbbf24; }
      .warn { fill: #fbbf24; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Os mesmos quatro números</text>
  <text x="0" y="44" class="muted cap">96, 97, 98 e 99 — só muda onde o eixo começa</text>

  <rect x="0" y="66" width="348" height="204" rx="8" class="box"/>
  <text x="18" y="90" class="muted k">EIXO COMEÇANDO EM ZERO</text>
  <line x1="60" y1="236" x2="330" y2="236" class="grid"/>
  <text x="30" y="240" class="muted ax">0</text>
  <text x="24" y="112" class="muted ax">100</text>
  <rect x="76"  y="112" width="44" height="124" rx="3" class="bar"/>
  <rect x="140" y="111" width="44" height="125" rx="3" class="bar"/>
  <rect x="204" y="110" width="44" height="126" rx="3" class="bar"/>
  <rect x="268" y="109" width="44" height="127" rx="3" class="bar"/>
  <text x="18" y="260" class="muted cap">A diferença é pequena — porque é pequena.</text>

  <rect x="372" y="66" width="348" height="204" rx="8" class="box"/>
  <text x="390" y="90" class="warn k">EIXO COMEÇANDO EM 95</text>
  <line x1="432" y1="236" x2="702" y2="236" class="grid"/>
  <text x="404" y="240" class="muted ax">95</text>
  <text x="398" y="112" class="muted ax">100</text>
  <rect x="448" y="211" width="44" height="25" rx="3" class="bar"/>
  <rect x="512" y="186" width="44" height="50" rx="3" class="bar"/>
  <rect x="576" y="161" width="44" height="75" rx="3" class="bar"/>
  <rect x="640" y="136" width="44" height="100" rx="3" class="bar"/>
  <text x="390" y="260" class="muted cap">A mesma diferença vira uma escalada.</text>

  <rect x="0" y="290" width="720" height="66" rx="8" class="warnb"/>
  <text x="18" y="314" class="warn k">O ACHADO QUE MUDA A DISCUSSÃO</text>
  <text x="18" y="336" class="muted cap">Marcar a quebra do eixo — com o símbolo de corte, com barras interrompidas — <tspan class="ink h">não desfaz o efeito</tspan>.</text>
  <text x="18" y="352" class="muted cap">O julgamento de magnitude é visual, não aritmético: quem vê a exageração continua exagerando.</text>

  <text x="0" y="386" class="muted cap">Correll, Bertini e Franconeri, 2020. A conclusão deles não é “sempre comece do zero” — é escolher a escala a</text>
  <text x="0" y="404" class="muted cap">partir de qual diferença de fato importa naquele domínio, e assumir essa decisão como responsabilidade.</text>
</svg>
