<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Legenda de gráfico: itens com amostra e rótulo ao lado das séries, versão com rótulo direto na linha e a alternativa com padrão para quem não distingue as cores">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Legenda de gráfico</text>
  <text x="0" y="44" class="muted cap">Toda legenda cobra um pedágio: o olho vai e volta entre o dado e a explicação. Vale reduzir o trajeto</text>

  <text x="0" y="76" class="ink h">Legenda separada &#8212; o padrão</text>
  <rect x="0" y="88" width="344" height="160" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="30" y1="216" x2="316" y2="216" stroke="#e5e7eb" stroke-width="1"/>
  <polyline points="40,196 100,178 160,182 220,150 280,132" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="40,206 100,200 160,192 220,196 280,186" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <polyline points="40,210 100,208 160,204 220,206 280,202" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <rect x="30" y="106" width="14" height="3" fill="#2563eb"/>
  <text x="52" y="112" font-size="9" fill="#1f2937">Celular</text>
  <rect x="106" y="106" width="14" height="3" fill="#16a34a"/>
  <text x="128" y="112" font-size="9" fill="#1f2937">Desktop</text>
  <rect x="186" y="106" width="14" height="3" fill="#d97706"/>
  <text x="208" y="112" font-size="9" fill="#1f2937">Tablet</text>
  <text x="30" y="238" class="muted sm">Amostra + rótulo, perto do gráfico. O olho vai e volta.</text>

  <text x="376" y="76" class="ok h">Rótulo direto na série &#8212; melhor quando cabe</text>
  <rect x="376" y="88" width="344" height="160" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <line x1="396" y1="216" x2="620" y2="216" stroke="#e5e7eb" stroke-width="1"/>
  <polyline points="406,196 456,178 506,182 556,150 606,126" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="614" y="130" font-size="9" font-weight="700" fill="#2563eb">Celular</text>
  <polyline points="406,206 456,200 506,192 556,196 606,180" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="614" y="184" font-size="9" font-weight="700" fill="#16a34a">Desktop</text>
  <polyline points="406,210 456,208 506,204 556,206 606,200" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="614" y="204" font-size="9" font-weight="700" fill="#d97706">Tablet</text>
  <text x="396" y="238" class="muted sm">Sem ida e volta: o nome já está onde o dado está.</text>

  <rect x="0" y="272" width="352" height="90" rx="6" class="card"/>
  <text x="16" y="296" class="ink h">Não deixe a cor sozinha</text>
  <line x1="16" y1="316" x2="46" y2="316" stroke="#2563eb" stroke-width="2.5"/>
  <text x="56" y="320" class="muted an">contínua</text>
  <line x1="120" y1="316" x2="150" y2="316" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="160" y="320" class="muted an">tracejada</text>
  <line x1="230" y1="316" x2="260" y2="316" stroke="#d97706" stroke-width="2.5" stroke-dasharray="2 3"/>
  <text x="270" y="320" class="muted an">pontilhada</text>
  <text x="16" y="344" class="muted sm">Traço, marcador ou textura mantêm a leitura em pé sem depender da cor.</text>

  <rect x="368" y="272" width="352" height="90" rx="6" class="card"/>
  <text x="384" y="296" class="ink h">Legenda interativa</text>
  <text x="384" y="316" class="muted an">Passar o mouse pode destacar a série; clicar pode ocultá-la.</text>
  <text x="384" y="332" class="muted an">Se fizer isso, precisa funcionar no teclado e dizer o estado —</text>
  <text x="384" y="348" class="muted an">aria-pressed no item que liga e desliga.</text></svg>
