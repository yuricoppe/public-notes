<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="As três listas do HTML — não ordenada, ordenada e de definição — e a comparação entre a mesma informação em parágrafo corrido e em lista">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Listas</text>
  <text x="0" y="44" class="muted cap">A marcação diz mais que o marcador: o leitor de tela anuncia "lista com 4 itens" antes de começar a ler</text>

  <rect x="0" y="70" width="232" height="164" rx="6" class="card"/>
  <text x="14" y="94" class="ink h">Não ordenada &#183; &lt;ul&gt;</text>
  <text x="14" y="112" class="muted sm">a ordem não importa</text>
  <circle cx="20" cy="132" r="3" fill="#6b7280"/>
  <text x="34" y="136" font-size="11" fill="#1f2937">Cartão de crédito</text>
  <circle cx="20" cy="154" r="3" fill="#6b7280"/>
  <text x="34" y="158" font-size="11" fill="#1f2937">Pix</text>
  <circle cx="20" cy="176" r="3" fill="#6b7280"/>
  <text x="34" y="180" font-size="11" fill="#1f2937">Boleto</text>
  <text x="14" y="212" class="muted sm">Trocar a ordem não muda o sentido.</text>

  <rect x="244" y="70" width="232" height="164" rx="6" class="card"/>
  <text x="258" y="94" class="ink h">Ordenada &#183; &lt;ol&gt;</text>
  <text x="258" y="112" class="muted sm">a sequência é a informação</text>
  <text x="258" y="136" font-size="11" fill="#6b7280">1.</text>
  <text x="278" y="136" font-size="11" fill="#1f2937">Confira o carrinho</text>
  <text x="258" y="158" font-size="11" fill="#6b7280">2.</text>
  <text x="278" y="158" font-size="11" fill="#1f2937">Informe a entrega</text>
  <text x="258" y="180" font-size="11" fill="#6b7280">3.</text>
  <text x="278" y="180" font-size="11" fill="#1f2937">Pague</text>
  <text x="258" y="212" class="muted sm">Fora de ordem, deixa de funcionar.</text>

  <rect x="488" y="70" width="232" height="164" rx="6" class="card"/>
  <text x="502" y="94" class="ink h">De definição &#183; &lt;dl&gt;</text>
  <text x="502" y="112" class="muted sm">pares de termo e descrição</text>
  <text x="502" y="136" font-size="11" font-weight="700" fill="#1f2937">Gutter</text>
  <text x="516" y="152" font-size="10" fill="#6b7280">O vão entre colunas.</text>
  <text x="502" y="176" font-size="11" font-weight="700" fill="#1f2937">Breakpoint</text>
  <text x="516" y="192" font-size="10" fill="#6b7280">Onde o layout muda.</text>
  <text x="502" y="212" class="accent sm">É o que um glossário deveria usar.</text>

  <text x="0" y="266" class="warn h">A mesma informação, enterrada em parágrafo</text>
  <rect x="0" y="278" width="352" height="72" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="14" y="300" font-size="10.5" fill="#6b7280">Aceitamos cartão de crédito, além de Pix e também</text>
  <text x="14" y="316" font-size="10.5" fill="#6b7280">boleto bancário, que leva até 3 dias úteis para</text>
  <text x="14" y="332" font-size="10.5" fill="#6b7280">compensar, e ainda cartão de débito em alguns casos.</text>

  <text x="368" y="266" class="ok h">Mesma informação, escaneável</text>
  <rect x="368" y="278" width="352" height="72" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <circle cx="390" cy="296" r="3" fill="#6b7280"/>
  <text x="404" y="300" font-size="10.5" fill="#1f2937">Cartão de crédito e débito</text>
  <circle cx="390" cy="313" r="3" fill="#6b7280"/>
  <text x="404" y="317" font-size="10.5" fill="#1f2937">Pix &#8212; na hora</text>
  <circle cx="390" cy="330" r="3" fill="#6b7280"/>
  <text x="404" y="334" font-size="10.5" fill="#1f2937">Boleto &#8212; até 3 dias úteis</text>

  <text x="0" y="374" class="muted cap">Regra prática: três ou mais itens paralelos numa frase quase sempre queriam ser uma lista.</text></svg>
