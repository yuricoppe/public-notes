<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Comparação entre conteúdo em bloco único, guardado como um campo de texto formatado, e conteúdo em pedaços nomeados, com título, resumo, corpo, imagem e metadados separados, mostrando que só a segunda forma pode ser reaproveitada em outros contextos">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .box   { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.3; }
    .blob  { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1.2; }
    .chunk { fill: #eef2ff; stroke: #2563eb; stroke-width: 1.2; }
    .accent{ fill: #2563eb; }
    .bad   { fill: #dc2626; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 14px; font-weight: 700; }
    .k   { font-size: 11px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #4b5563; }
      .blob { fill: #374151; stroke: #6b7280; }
      .chunk { fill: #1e293b; stroke: #60a5fa; }
      .accent { fill: #60a5fa; }
      .bad { fill: #f87171; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Bloco ou pedaços</text>
  <text x="0" y="44" class="muted cap">A decisão de modelagem que determina se o conteúdo poderá ir para outro lugar depois</text>

  <rect x="0" y="66" width="348" height="234" rx="8" class="box"/>
  <text x="18" y="92" class="bad k">BLOCO ÚNICO</text>
  <rect x="18" y="104" width="312" height="120" rx="5" class="blob"/>
  <text x="32" y="126" class="muted mono">&lt;h1&gt;Título&lt;/h1&gt;&lt;p&gt;&lt;b&gt;Resumo&lt;/b&gt;</text>
  <text x="32" y="144" class="muted mono">em negrito porque parecia certo…&lt;/p&gt;</text>
  <text x="32" y="162" class="muted mono">&lt;img src="…"&gt;&lt;p&gt;Corpo, com o preço</text>
  <text x="32" y="180" class="muted mono">escrito no meio da frase e a data</text>
  <text x="32" y="198" class="muted mono">formatada à mão…&lt;/p&gt;</text>
  <text x="18" y="248" class="muted cap">Tudo num campo só, editado num</text>
  <text x="18" y="266" class="muted cap">editor de texto rico. A aparência</text>
  <text x="18" y="284" class="muted cap">está grudada no significado.</text>

  <rect x="372" y="66" width="348" height="234" rx="8" class="box"/>
  <text x="390" y="92" class="accent k">PEDAÇOS NOMEADOS</text>
  <rect x="390" y="104" width="312" height="22" rx="4" class="chunk"/>
  <text x="402" y="119" class="accent mono">titulo</text>
  <rect x="390" y="130" width="312" height="22" rx="4" class="chunk"/>
  <text x="402" y="145" class="accent mono">resumo (máx. 160 caracteres)</text>
  <rect x="390" y="156" width="312" height="22" rx="4" class="chunk"/>
  <text x="402" y="171" class="accent mono">corpo</text>
  <rect x="390" y="182" width="152" height="22" rx="4" class="chunk"/>
  <text x="402" y="197" class="accent mono">preco</text>
  <rect x="550" y="182" width="152" height="22" rx="4" class="chunk"/>
  <text x="562" y="197" class="accent mono">data</text>
  <rect x="390" y="208" width="312" height="22" rx="4" class="chunk"/>
  <text x="402" y="223" class="accent mono">imagem + texto alternativo</text>
  <text x="390" y="256" class="muted cap">Cada parte tem nome, tipo e regra.</text>
  <text x="390" y="274" class="muted cap">A apresentação é decidida depois,</text>
  <text x="390" y="292" class="muted cap">por quem exibe.</text>

  <text x="0" y="332" class="muted cap">O teste é simples: peça o resumo de todos os artigos para montar uma lista, ou o preço para mandar por push.</text>
  <text x="0" y="350" class="muted cap">Se a resposta é “dá para fazer, mas alguém vai ter que copiar à mão”, o conteúdo está em bloco.</text>
  <text x="0" y="370" class="muted cap">Escrever para um lugar só é a decisão que impede o reúso — e ela é tomada no modelo, não no texto.</text>
</svg>
