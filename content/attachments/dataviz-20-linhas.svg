<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-label="Dois problemas de gráfico de linha: quando o dado é medido em intervalos longos a linha inventa os valores intermediários e o certo é usar barras, e a linha suavizada cria curvas onde os dados têm quinas, escondendo os pontos medidos">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .plot  { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; }
    .axis  { stroke: #9ca3af; stroke-width: 1; }
    .mark  { fill: #2563eb; }
    .ln    { stroke: #2563eb; stroke-width: 2; fill: none; }
    .ghost { stroke: #dc2626; stroke-width: 1.4; fill: none; stroke-dasharray: 3 3; }
    .bad   { fill: #dc2626; }
    .ok    { fill: #10b981; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .why { font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .cap { font-size: 12.5px; }
    .tiny{ font-size: 9px; }
    .badge { font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .plot { fill: #111827; stroke: #374151; }
      .axis { stroke: #6b7280; }
      .mark { fill: #60a5fa; } .ln { stroke: #60a5fa; }
      .ghost { stroke: #f87171; }
      .bad { fill: #f87171; } .ok { fill: #34d399; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Duas mentiras que a linha conta</text>
  <text x="0" y="44" class="muted cap">As duas nascem da mesma coisa: o traço entre dois pontos afirma que existe algo entre eles</text>

  <rect x="0" y="62" width="352" height="200" rx="8" class="card"/>
  <text x="16" y="86" class="ink h">Medição esparsa</text>
  <text x="16" y="104" class="muted why">Receita trimestral desenhada como linha: quem lê</text>
  <text x="16" y="119" class="muted why">presume os meses do meio, que ninguém mediu.</text>
  <rect x="16" y="132" width="152" height="112" rx="4" class="plot"/>
  <text x="22" y="147" class="bad badge">✕</text>
  <line x1="34" y1="226" x2="158" y2="226" class="axis"/>
  <path d="M44 208 L80 190 L116 198 L150 168" class="ln"/>
  <circle cx="44" cy="208" r="3" class="mark"/><circle cx="80" cy="190" r="3" class="mark"/>
  <circle cx="116" cy="198" r="3" class="mark"/><circle cx="150" cy="168" r="3" class="mark"/>
  <text x="40" y="238" class="muted tiny">T1</text><text x="76" y="238" class="muted tiny">T2</text>
  <text x="112" y="238" class="muted tiny">T3</text><text x="146" y="238" class="muted tiny">T4</text>
  <text x="30" y="162" class="bad tiny">e aqui? nada foi medido</text>
  <rect x="184" y="132" width="152" height="112" rx="4" class="plot"/>
  <text x="190" y="147" class="ok badge">✓</text>
  <line x1="202" y1="226" x2="326" y2="226" class="axis"/>
  <rect x="212" y="208" width="22" height="18" class="mark"/>
  <rect x="248" y="190" width="22" height="36" class="mark"/>
  <rect x="284" y="198" width="22" height="28" class="mark"/>
  <rect x="300" y="168" width="0" height="0" class="mark"/>
  <text x="208" y="238" class="muted tiny">T1</text><text x="244" y="238" class="muted tiny">T2</text>
  <text x="280" y="238" class="muted tiny">T3</text>
  <text x="200" y="162" class="ok tiny">cada barra é uma medição</text>

  <rect x="368" y="62" width="352" height="200" rx="8" class="card"/>
  <text x="384" y="86" class="ink h">Linha suavizada</text>
  <text x="384" y="104" class="muted why">A curva é agradável e inventa mínimos e máximos</text>
  <text x="384" y="119" class="muted why">que não existem. Traço grosso ainda esconde o ponto.</text>
  <rect x="384" y="132" width="152" height="112" rx="4" class="plot"/>
  <text x="390" y="147" class="bad badge">✕</text>
  <line x1="402" y1="226" x2="526" y2="226" class="axis"/>
  <path d="M410 206 C 424 206, 424 172, 440 172 C 458 172, 452 214, 472 214 C 492 214, 486 164, 508 164 C 514 164, 516 170, 518 174" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="396" y="160" class="bad tiny">esse vale não existe</text>
  <path d="M462 200 l 6 10" class="ghost"/>
  <rect x="552" y="132" width="152" height="112" rx="4" class="plot"/>
  <text x="558" y="147" class="ok badge">✓</text>
  <line x1="570" y1="226" x2="694" y2="226" class="axis"/>
  <path d="M578 206 L608 172 L640 214 L676 164" class="ln"/>
  <circle cx="578" cy="206" r="3" class="mark"/><circle cx="608" cy="172" r="3" class="mark"/>
  <circle cx="640" cy="214" r="3" class="mark"/><circle cx="676" cy="164" r="3" class="mark"/>
  <text x="566" y="160" class="ok tiny">os pontos medidos aparecem</text>

  <text x="0" y="296" class="muted cap">O primeiro caso é o mais subestimado da lista: a linha faz uma afirmação sobre continuidade que os dados</text>
  <text x="0" y="314" class="muted cap">podem não sustentar. Em dado de saúde, que chega com atraso e é revisado depois, isso pesa ainda mais.</text>
</svg>
