<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Diferença entre wrapper de seção e container: o wrapper ocupa 100 por cento da largura e carrega o fundo até a borda da tela, enquanto o container limita a largura máxima e se centraliza; em tela estreita o container só aplica o padding lateral">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .vp    { fill: none; stroke: #9ca3af; stroke-width: 1.5; }
    .wrap  { fill: #f3f4f6; }
    .cont  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .arrow { stroke: #2563eb; stroke-width: 1.2; }
    .accent{ fill: #2563eb; }
    .swatch{ fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.2; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13.5px; font-weight: 700; }
    .an  { font-size: 12px; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .vp { stroke: #6b7280; }
      .wrap { fill: #1f2937; }
      .cont { fill: #111827; stroke: #60a5fa; }
      .arrow { stroke: #60a5fa; }
      .accent { fill: #60a5fa; }
      .swatch { fill: #1f2937; stroke: #4b5563; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Wrapper de seção e container fazem coisas diferentes</text>
  <text x="0" y="44" class="muted cap">Um leva o fundo até a borda da tela; o outro impede que a linha de texto fique longa demais para ler</text>

  <!-- wide screen -->
  <text x="0" y="76" class="ink h">Tela larga</text>
  <rect x="0" y="88" width="720" height="126" rx="4" class="vp"/>
  <rect x="1.5" y="114" width="717" height="74" class="wrap"/>
  <rect x="190" y="126" width="340" height="50" rx="4" class="cont"/>
  <text x="206" y="147" class="ink an">Conteúdo da seção</text>
  <text x="206" y="166" class="muted an">largura máxima 1200px, centralizado</text>

  <line x1="8" y1="151" x2="184" y2="151" class="arrow"/>
  <line x1="8" y1="147" x2="8" y2="155" class="arrow"/>
  <line x1="184" y1="147" x2="184" y2="155" class="arrow"/>
  <text x="34" y="143" class="accent an">margin auto</text>

  <line x1="536" y1="151" x2="712" y2="151" class="arrow"/>
  <line x1="536" y1="147" x2="536" y2="155" class="arrow"/>
  <line x1="712" y1="147" x2="712" y2="155" class="arrow"/>
  <text x="562" y="143" class="accent an">margin auto</text>

  <text x="8" y="106" class="muted an">o fundo do wrapper sangra de ponta a ponta — o conteúdo, não</text>
  <text x="8" y="206" class="muted an">viewport</text>

  <!-- narrow screen + legend -->
  <text x="0" y="252" class="ink h">Tela estreita</text>
  <rect x="0" y="264" width="250" height="104" rx="4" class="vp"/>
  <rect x="1.5" y="286" width="247" height="62" class="wrap"/>
  <rect x="17" y="296" width="216" height="42" rx="4" class="cont"/>
  <text x="29" y="322" class="muted an">largura máxima nunca é atingida</text>
  <line x1="2" y1="378" x2="17" y2="378" class="arrow"/>
  <text x="24" y="382" class="accent an">só o padding lateral (16px) continua valendo</text>

  <rect x="290" y="252" width="430" height="52" rx="6" class="swatch"/>
  <rect x="304" y="266" width="16" height="24" class="wrap"/>
  <text x="330" y="274" class="ink an">Wrapper de seção</text>
  <text x="330" y="292" class="muted an">100% de largura. Carrega fundo e padding vertical.</text>

  <rect x="290" y="312" width="430" height="52" rx="6" class="swatch"/>
  <rect x="304" y="326" width="16" height="24" rx="2" class="cont"/>
  <text x="330" y="334" class="ink an">Container</text>
  <text x="330" y="352" class="muted an">Limita a largura máxima e se centraliza. Vive dentro do wrapper.</text>

  <text x="0" y="396" class="muted cap">Trocar os papéis é o erro comum: container com cor de fundo deixa uma faixa que para antes da borda.</text>
</svg>
