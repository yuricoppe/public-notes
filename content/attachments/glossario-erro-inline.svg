<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Mensagem de erro inline: versão ruim com código técnico e versão boa que diz o problema e como resolver, mais a ligação por aria-describedby e aria-invalid">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .accent{ fill: #2563eb; }
    .warn  { fill: #dc2626; }
    .ok    { fill: #16a34a; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1.2; }
    .lead  { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge { fill: #2563eb; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .sm  { font-size: 10.5px; }
    .cap { font-size: 13px; }
    .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .accent { fill: #60a5fa; }
      .warn { fill: #f87171; }
      .ok { fill: #34d399; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .frame { stroke: #6b7280; }
      .lead { stroke: #6b7280; }
      .arrow { stroke: #6b7280; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Erro inline</text>
  <text x="0" y="44" class="muted cap">A mensagem de erro é a única parte da interface que só aparece quando algo já deu errado. Não é hora de economizar palavras</text>

  <text x="0" y="76" class="warn h">Não resolve</text>
  <rect x="0" y="88" width="344" height="112" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="16" y="112" font-size="9" fill="#6b7280">Telefone</text>
  <rect x="16" y="118" width="200" height="28" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="26" y="137" font-size="11" fill="#1f2937">11987654321</text>
  <text x="16" y="166" font-size="10" fill="#dc2626">Campo inválido.</text>
  <text x="16" y="186" class="muted sm">Diz que errou, não diz o quê nem como sair.</text>

  <text x="376" y="76" class="ok h">Resolve</text>
  <rect x="376" y="88" width="344" height="112" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="392" y="112" font-size="9" fill="#6b7280">Telefone</text>
  <rect x="392" y="118" width="200" height="28" rx="5" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="402" y="137" font-size="11" fill="#1f2937">11987654321</text>
  <text x="392" y="166" font-size="10" fill="#dc2626">&#9888; Faltou o DDD entre parênteses.</text>
  <text x="392" y="182" font-size="10" fill="#dc2626">Exemplo: (11) 98765-4321</text>
  <text x="392" y="196" class="muted sm"> </text>

  <rect x="0" y="222" width="720" height="86" rx="6" class="card"/>
  <text x="16" y="246" class="ink h">A ligação que o leitor de tela precisa</text>
  <text x="16" y="270" class="accent mono">&lt;input id="tel" aria-invalid="true" aria-describedby="tel-erro"&gt;</text>
  <text x="16" y="292" class="accent mono">&lt;p id="tel-erro" role="alert"&gt;Faltou o DDD entre parênteses.&lt;/p&gt;</text>

  <text x="0" y="336" class="ink h">Ícone além da cor</text>
  <text x="0" y="356" class="muted an">Vermelho sozinho não chega em quem</text>
  <text x="0" y="372" class="muted an">não distingue vermelho de verde.</text>

  <text x="244" y="336" class="ink h">Na hora certa</text>
  <text x="244" y="356" class="muted an">Ao sair do campo, não a cada tecla.</text>
  <text x="244" y="372" class="muted an">Validar enquanto se digita acusa erro</text>
  <text x="244" y="388" class="muted an">em texto que ainda está pela metade.</text>

  <text x="488" y="336" class="ink h">Nunca limpe o campo</text>
  <text x="488" y="356" class="muted an">Apagar o que a pessoa escreveu por</text>
  <text x="488" y="372" class="muted an">causa de um erro obriga a redigitar</text>
  <text x="488" y="388" class="muted an">tudo. Só senha é exceção.</text></svg>
