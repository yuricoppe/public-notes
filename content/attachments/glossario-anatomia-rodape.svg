<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Rodapé organizado em colunas temáticas com barra legal embaixo, e a versão empilhada em uma coluna no mobile">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .ink   { fill: #1f2937; }
    .muted { fill: #6b7280; }
    .card  { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.2; }
    .accent{ fill: #2563eb; }
    .ttl { font-size: 17px; font-weight: 700; }
    .h   { font-size: 13px; font-weight: 700; }
    .an  { font-size: 11.5px; }
    .cap { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .card { fill: #1f2937; stroke: #4b5563; }
      .accent { fill: #60a5fa; }
    }
  </style>

  <text x="0" y="22" class="ink ttl">Rodapé: o lugar onde as pessoas vão quando o resto do site não respondeu</text>
  <text x="0" y="44" class="muted cap">Contato, política e "quem são vocês" acabam sendo procurados aqui — vale organizar em vez de despejar links</text>

  <!-- footer desktop -->
  <rect x="0" y="66" width="720" height="184" rx="6" fill="#111827"/>

  <text x="24" y="98" font-size="13" font-weight="700" fill="#ffffff">LOJA</text>
  <text x="24" y="120" font-size="10" fill="#9ca3af">Rua Exemplo, 100</text>
  <text x="24" y="136" font-size="10" fill="#9ca3af">São Paulo — SP</text>
  <circle cx="30" cy="162" r="9" fill="#374151"/>
  <circle cx="54" cy="162" r="9" fill="#374151"/>
  <circle cx="78" cy="162" r="9" fill="#374151"/>

  <text x="190" y="98" font-size="10" font-weight="700" fill="#ffffff">EMPRESA</text>
  <text x="190" y="120" font-size="10.5" fill="#d1d5db">Sobre nós</text>
  <text x="190" y="140" font-size="10.5" fill="#d1d5db">Carreiras</text>
  <text x="190" y="160" font-size="10.5" fill="#d1d5db">Imprensa</text>

  <text x="330" y="98" font-size="10" font-weight="700" fill="#ffffff">AJUDA</text>
  <text x="330" y="120" font-size="10.5" fill="#d1d5db">Central de ajuda</text>
  <text x="330" y="140" font-size="10.5" fill="#d1d5db">Rastrear pedido</text>
  <text x="330" y="160" font-size="10.5" fill="#d1d5db">Fale conosco</text>

  <text x="480" y="98" font-size="10" font-weight="700" fill="#ffffff">LEGAL</text>
  <text x="480" y="120" font-size="10.5" fill="#d1d5db">Termos de uso</text>
  <text x="480" y="140" font-size="10.5" fill="#d1d5db">Privacidade</text>
  <text x="480" y="160" font-size="10.5" fill="#d1d5db">Cookies</text>

  <text x="612" y="98" font-size="10" font-weight="700" fill="#ffffff">IDIOMA</text>
  <rect x="612" y="106" width="86" height="24" rx="4" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="622" y="122" font-size="10" fill="#d1d5db">Português</text>
  <path d="M 680 116 L 684 120 L 688 116" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>

  <line x1="24" y1="196" x2="696" y2="196" stroke="#374151" stroke-width="1"/>
  <text x="24" y="222" font-size="10" fill="#6b7280">© 2026 Loja Exemplo Ltda · CNPJ 00.000.000/0001-00</text>
  <text x="696" y="222" font-size="10" fill="#6b7280" text-anchor="end">Voltar ao topo ↑</text>

  <!-- mobile -->
  <rect x="0" y="272" width="150" height="112" rx="6" fill="#111827"/>
  <text x="14" y="292" font-size="9" font-weight="700" fill="#ffffff">EMPRESA</text>
  <path d="M 130 288 L 134 292 L 138 288" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="300" x2="136" y2="300" stroke="#374151" stroke-width="1"/>
  <text x="14" y="318" font-size="9" font-weight="700" fill="#ffffff">AJUDA</text>
  <path d="M 130 314 L 134 318 L 138 314" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="326" x2="136" y2="326" stroke="#374151" stroke-width="1"/>
  <text x="14" y="344" font-size="9" font-weight="700" fill="#ffffff">LEGAL</text>
  <path d="M 130 340 L 134 344 L 138 340" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14" y1="352" x2="136" y2="352" stroke="#374151" stroke-width="1"/>
  <text x="14" y="372" font-size="8" fill="#6b7280">© 2026 Loja Exemplo</text>

  <text x="170" y="292" class="ink h">Colunas com nome, não uma lista só</text>
  <text x="170" y="312" class="muted an">"Empresa", "Ajuda", "Legal" — a pessoa escolhe a coluna antes de ler os links.</text>
  <text x="170" y="328" class="muted an">Sem títulos, o rodapé vira um bloco de trinta links que ninguém varre.</text>

  <text x="170" y="356" class="accent h">No mobile, as colunas viram acordeões</text>
  <text x="170" y="376" class="muted an">Empilhar tudo aberto transforma o rodapé numa rolagem infinita depois do conteúdo.</text>
</svg>
